<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notícia - Central Free Fire</title>
  <meta name="description" content="Leia a notícia completa na Central Free Fire." />
  <meta name="theme-color" content="#00c8ff">
  <link rel="icon" type="image/webp" href="central free fire.webp">

  <!-- Open Graph padrão. O JS atualiza depois que carregar a notícia -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="Notícia - Central Free Fire">
  <meta property="og:description" content="Leia a notícia completa na Central Free Fire.">
  <meta property="og:image" content="central free fire.webp">

  <style>
    :root {
      --bg-color: #050810;
      --panel-bg: #0d1220;
      --panel-hover: #141a2e;
      --border: #1e2a45;
      --accent: #00c8ff;
      --text: #ffffff;
      --text-muted: #7a9bbf;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(0,200,255,0.08), transparent 35%), var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.65;
    }

    a { color: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(2, 5, 9, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--accent);
    }

    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .brand img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(0,200,255,0.35));
    }

    .back-btn {
      border: 1px solid var(--border);
      color: var(--accent);
      background: rgba(0,200,255,0.06);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 800;
      text-decoration: none;
      font-size: 0.82rem;
      text-transform: uppercase;
      transition: .2s;
      white-space: nowrap;
    }

    .back-btn:hover {
      border-color: var(--accent);
      background: rgba(0,200,255,0.12);
      transform: translateY(-1px);
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    .article-shell {
      position: relative;
      background: rgba(13, 18, 32, 0.78);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0,0,0,0.35);
    }

    .article-shell::before {
      content: "";
      display: block;
      height: 4px;
      background: var(--accent);
    }

    .hero-img {
      width: 100%;
      height: min(52vw, 460px);
      min-height: 240px;
      object-fit: cover;
      display: block;
      background: #080d18;
      border-bottom: 1px solid var(--border);
    }

    .article-content {
      padding: clamp(20px, 4vw, 42px);
    }

    .kicker {
      color: var(--accent);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 0.78rem;
      margin-bottom: 10px;
    }

    h1 {
      color: #fff;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      line-height: 1.05;
      margin: 0 0 12px;
      text-transform: uppercase;
      letter-spacing: -0.8px;
    }

    .summary {
      color: #c7d6e8;
      font-size: clamp(1rem, 2.2vw, 1.18rem);
      margin: 0 0 16px;
      max-width: 820px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: var(--text-muted);
      font-size: 0.84rem;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 26px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: .5px;
    }

    .body {
      color: #edf6ff;
      font-size: 1.06rem;
    }

    .body p {
      margin: 0 0 20px;
    }

    .body h2,
    .body h3,
    .body h4,
    .body h5,
    .body h6 {
      color: var(--accent);
      margin: 34px 0 14px;
      line-height: 1.18;
      text-transform: uppercase;
      font-weight: 900;
    }

    .body h2 { font-size: 1.35rem; }
    .body h3 { font-size: 1.25rem; }
    .body h4 { font-size: 1.15rem; }
    .body h5 { font-size: 1.05rem; }
    .body h6 { font-size: 1rem; }

    .body img.inline-img {
      display: block;
      width: 100%;
      max-height: 560px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin: 28px 0;
      background: #080d18;
    }

    .body blockquote {
      margin: 26px 0;
      padding: 18px 20px;
      border-left: 4px solid var(--accent);
      background: rgba(0,200,255,0.06);
      color: #dff7ff;
      border-radius: 10px;
      font-weight: 700;
    }

    .original-link {
      display: inline-flex;
      margin-top: 20px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 16px;
      color: var(--accent);
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.82rem;
      font-weight: 900;
      transition: .2s;
    }

    .original-link:hover {
      border-color: var(--accent);
      background: rgba(0,200,255,0.08);
    }

    .loading, .error {
      text-align: center;
      padding: 70px 22px;
      background: rgba(13, 18, 32, 0.78);
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--text-muted);
    }

    .loading strong, .error strong {
      display: block;
      color: var(--accent);
      font-size: 1.2rem;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .more-news {
      margin-top: 28px;
    }

    .more-news h2 {
      color: var(--accent);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .more-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }

    .more-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      transition: .2s;
    }

    .more-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      background: var(--panel-hover);
    }

    .more-card img {
      width: 100%;
      height: 135px;
      object-fit: cover;
      display: block;
      background: #080d18;
    }

    .more-card-title {
      padding: 12px;
      font-weight: 900;
      font-size: .88rem;
      text-transform: uppercase;
      line-height: 1.35;
    }

    @media (max-width: 640px) {
      .topbar-inner { padding: 10px 12px; }
      .brand span { font-size: .8rem; }
      .back-btn { padding: 7px 10px; font-size: .72rem; }
      .wrap { padding: 18px 10px 42px; }
      .article-content { padding: 20px 16px 26px; }
      .hero-img { min-height: 210px; }
      .body { font-size: 1rem; }
      .meta { font-size: .72rem; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <img src="central free fire.webp" alt="Central Free Fire" onerror="this.style.display='none'">
        <span>Central Free Fire</span>
      </a>
      <a class="back-btn" href="index.html">← Voltar ao site</a>
    </div>
  </header>

  <main class="wrap">
    <div id="noticia-root" class="loading">
      <strong>Carregando notícia</strong>
      Buscando os dados da planilha...
    </div>

    <section class="more-news" id="more-news" style="display:none;">
      <h2>Mais notícias</h2>
      <div class="more-grid" id="more-grid"></div>
    </section>
  </main>

  <script>
    // MESMA PLANILHA/ABA QUE VOCÊ JÁ USA PARA AS NOTÍCIAS
    const NOTICIAS_TSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR6Paknya4E3qRT2mLd0fQMIiBKhuGOPebF0pLK9c0Gk5nRnVWNdY4FxMJV42467JLmwNNumXSc4fCC/pub?gid=0&single=true&output=tsv';

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[char]));
    }

    function slugify(text) {
      return String(text || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function convertDriveImage(url) {
      url = String(url || '').trim().replace(/\r/g, '');
      if (!url) return '';
      if (url.includes('drive.google.com')) {
        const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) return `https://drive.google.com/uc?export=view&id=${match[1]}`;
      }
      return url;
    }

    function parseTSV(text) {
      // Parser TSV mais seguro: preserva quebras de linha dentro de células entre aspas
      const rows = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      const source = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      for (let i = 0; i < source.length; i++) {
        const char = source[i];
        const next = source[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === '\t' && !inQuotes) {
          row.push(cell.trim());
          cell = '';
        } else if (char === '\n' && !inQuotes) {
          row.push(cell.trim());
          if (row.some(v => v !== '')) rows.push(row);
          row = [];
          cell = '';
        } else {
          cell += char;
        }
      }

      row.push(cell.trim());
      if (row.some(v => v !== '')) rows.push(row);

      if (!rows.length) return [];

      const headers = rows[0].map(h => h.trim().toLowerCase());
      const hasNewHeaders = headers.includes('id') || headers.includes('conteudo') || headers.includes('resumo');

      return rows.slice(1).map((cells) => {
        let item = {};

        if (hasNewHeaders) {
          headers.forEach((h, i) => item[h] = cells[i] || '');
        } else {
          // Compatibilidade com a estrutura antiga:
          // imagem | titulo | link | destaque
          item = {
            imagem: cells[0] || '',
            titulo: cells[1] || '',
            link_original: cells[2] || '',
            destaque: cells[3] || ''
          };
        }

        item.imagem = convertDriveImage(item.imagem);
        item.imagem_meio = convertDriveImage(item.imagem_meio || item['imagem meio'] || '');
        item.titulo = item.titulo || '';
        item.id = item.id || slugify(item.titulo);
        item.resumo = item.resumo || '';
        item.conteudo = item.conteudo || '';
        item.data = item.data || '';
        item.autor = item.autor || 'Central Free Fire';
        item.link_original = item.link_original || item.link || '';
        item.destaque = String(item.destaque || '').toLowerCase().includes('true');

        return item;
      }).filter(n => n.titulo && n.titulo.length > 2);
    }

    function formatDate(dateText) {
      if (!dateText) return '';
      const raw = String(dateText).trim();

      // Aceita formato brasileiro: 07/05/2026
      const br = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (br) {
        const [, d, m, y] = br;
        return `${d.padStart(2, '0')}/${m.padStart(2, '0')}/${y}`;
      }

      // Aceita formato ISO: 2026-05-07
      const iso = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (iso) {
        const [, y, m, d] = iso;
        return `${d.padStart(2, '0')}/${m.padStart(2, '0')}/${y}`;
      }

      return raw;
    }

    function getISODate(dateText) {
      if (!dateText) return new Date().toISOString();
      const raw = String(dateText).trim();

      const br = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (br) {
        const [, d, m, y] = br;
        return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
      }

      const iso = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (iso) return raw;

      return new Date().toISOString();
    }

    function renderBody(noticia) {
      const parts = [];

      function pushParagraph(text) {
        const clean = String(text || '').trim();
        if (!clean) return;
        parts.push(`<p>${escapeHTML(clean)}</p>`);
      }

      function pushImage(src) {
        const cleanSrc = convertDriveImage(String(src || '').trim());
        if (!cleanSrc) return;
        parts.push(`<img class="inline-img" src="${escapeHTML(cleanSrc)}" alt="${escapeHTML(noticia.titulo)}" onerror="this.src='central free fire.webp'">`);
      }

      function pushHeading(level, text) {
        const clean = String(text || '').trim();
        if (!clean) return;

        const safeLevel = ['H2', 'H3', 'H4', 'H5', 'H6'].includes(String(level).toUpperCase())
          ? String(level).toLowerCase()
          : 'h2';

        parts.push(`<${safeLevel}>${escapeHTML(clean)}</${safeLevel}>`);
      }

      function pushQuote(text) {
        const clean = String(text || '').trim();
        if (!clean) return;
        parts.push(`<blockquote>${escapeHTML(clean)}</blockquote>`);
      }

      function renderRichContent(rawContent) {
        let text = String(rawContent || '')
          .replace(/
/g, '\n')
          .replace(/
/g, '\n')
          .replace(/\\n/g, '\n');

        // Comandos aceitos dentro da célula da planilha:
        // [P] ou <br>      = separa parágrafo
        // [IMG: link]      = imagem no meio da notícia
        // [H2: texto]      = subtítulo grande
        // [H3: texto]      = subtítulo médio
        // [H4: texto]      = subtítulo menor
        // [H5: texto]      = subtítulo menor
        // [QUOTE: texto]   = citação/destaque
        text = text
          .replace(/\s*\[P\]\s*/gi, '\n[P]\n')
          .replace(/\s*<br\s*\/?\s*>\s*/gi, '\n[P]\n')
          .replace(/\s*\[(IMG|H2|H3|H4|H5|H6|QUOTE):/gi, '\n[$1:')
          .replace(/\]\s*/g, ']\n');

        // Também aceita sem colchetes: IMG:, H2:, H3:, H4:, H5:, H6:, QUOTE:
        text = text
          .replace(/\s+(IMG:https?:\/\/)/gi, '\n$1')
          .replace(/\s+(H2:|H3:|H4:|H5:|H6:|QUOTE:)/gi, '\n$1');

        const lines = text.split('\n').map(l => l.trim());
        let paragraphBuffer = [];

        function flushParagraph() {
          if (paragraphBuffer.length) {
            pushParagraph(paragraphBuffer.join(' '));
            paragraphBuffer = [];
          }
        }

        lines.forEach(line => {
          // Linha vazia ou [P] vira parágrafo novo
          if (!line || /^\[P\]$/i.test(line)) {
            flushParagraph();
            return;
          }

          // Formato com colchetes: [IMG: link], [H2: texto], [H3: texto]...
          const bracketMatch = line.match(/^\[(IMG|H2|H3|H4|H5|H6|QUOTE):([\s\S]+)\]$/i);
          if (bracketMatch) {
            flushParagraph();

            const type = bracketMatch[1].toUpperCase();
            const value = bracketMatch[2].trim();

            if (type === 'IMG') pushImage(value);
            else if (type === 'QUOTE') pushQuote(value);
            else pushHeading(type, value);

            return;
          }

          // Formato sem colchetes: IMG: link, H2: texto, H3: texto...
          const simpleMatch = line.match(/^(IMG|H2|H3|H4|H5|H6|QUOTE):([\s\S]+)$/i);
          if (simpleMatch) {
            flushParagraph();

            const type = simpleMatch[1].toUpperCase();
            const value = simpleMatch[2].trim();

            if (type === 'IMG') pushImage(value);
            else if (type === 'QUOTE') pushQuote(value);
            else pushHeading(type, value);

            return;
          }

          paragraphBuffer.push(line);
        });

        flushParagraph();
      }

      // Prioridade 1: coluna "conteudo"
      if (noticia.conteudo) {
        renderRichContent(noticia.conteudo);
      }

      // Prioridade 2: colunas separadas
      const texto1 = noticia.texto1 || noticia['texto 1'] || '';
      const texto2 = noticia.texto2 || noticia['texto 2'] || '';

      if (!parts.length && texto1) {
        renderRichContent(texto1);
      }

      if (!parts.length && noticia.resumo) {
        pushParagraph(noticia.resumo);
      }

      if (noticia.imagem_meio) {
        pushImage(noticia.imagem_meio);
      }

      if (texto2) {
        renderRichContent(texto2);
      }

      if (!parts.length) {
        parts.push('<p>Essa notícia ainda não tem texto completo cadastrado na planilha.</p>');
      }

      return parts.join('');
    }

    function updateMeta(noticia) {
      document.title = `${noticia.titulo} - Central Free Fire`;

      const description = noticia.resumo || noticia.conteudo.split(/\n/)[0] || 'Leia a notícia completa na Central Free Fire.';
      const image = noticia.imagem || 'central free fire.webp';
      const currentUrl = window.location.href;

      const setMeta = (selector, attr, value) => {
        let el = document.querySelector(selector);
        if (!el) {
          el = document.createElement('meta');
          if (selector.includes('property=')) {
            el.setAttribute('property', selector.match(/property="([^"]+)"/)?.[1] || '');
          } else {
            el.setAttribute('name', selector.match(/name="([^"]+)"/)?.[1] || '');
          }
          document.head.appendChild(el);
        }
        el.setAttribute(attr, value);
      };

      setMeta('meta[name="description"]', 'content', description);
      setMeta('meta[property="og:title"]', 'content', noticia.titulo);
      setMeta('meta[property="og:description"]', 'content', description);
      setMeta('meta[property="og:image"]', 'content', image);
      setMeta('meta[property="og:url"]', 'content', currentUrl);

      const oldJsonLd = document.getElementById('article-jsonld');
      if (oldJsonLd) oldJsonLd.remove();

      const jsonLd = document.createElement('script');
      jsonLd.type = 'application/ld+json';
      jsonLd.id = 'article-jsonld';
      jsonLd.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "NewsArticle",
        "headline": noticia.titulo,
        "description": description,
        "image": [image],
        "datePublished": getISODate(noticia.data),
        "dateModified": getISODate(noticia.data),
        "author": {
          "@type": "Organization",
          "name": noticia.autor || "Central Free Fire"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Central Free Fire",
          "logo": {
            "@type": "ImageObject",
            "url": "central free fire.webp"
          }
        },
        "mainEntityOfPage": {
          "@type": "WebPage",
          "@id": currentUrl
        }
      });
      document.head.appendChild(jsonLd);
    }

    function renderArticle(noticia) {
      const root = document.getElementById('noticia-root');
      updateMeta(noticia);

      root.className = 'article-shell';
      root.innerHTML = `
        <article>
          <div class="article-content">
            <div class="kicker">Notícia</div>
            <h1>${escapeHTML(noticia.titulo)}</h1>
            ${noticia.resumo ? `<p class="summary">${escapeHTML(noticia.resumo)}</p>` : ''}
            <div class="meta">
              ${noticia.data ? `<span>${escapeHTML(formatDate(noticia.data))}</span>` : ''}
              <span>${escapeHTML(noticia.autor || 'Central Free Fire')}</span>
            </div>
            <div class="body">
              ${renderBody(noticia)}
              ${noticia.link_original ? `<a class="original-link" href="${escapeHTML(noticia.link_original)}" target="_blank" rel="noopener">Ver publicação original</a>` : ''}
            </div>
          </div>
        </article>
      `;
    }

    function renderMoreNews(allNews, currentId) {
      const more = allNews.filter(n => n.id !== currentId).slice(0, 6);
      const section = document.getElementById('more-news');
      const grid = document.getElementById('more-grid');

      if (!more.length) return;

      section.style.display = 'block';
      grid.innerHTML = more.map(n => `
        <a class="more-card" href="noticia.html?id=${encodeURIComponent(n.id)}">
          <img src="${escapeHTML(n.imagem || 'central free fire.webp')}" alt="${escapeHTML(n.titulo)}" onerror="this.src='central free fire.webp'">
          <div class="more-card-title">${escapeHTML(n.titulo)}</div>
        </a>
      `).join('');
    }

    async function loadNoticia() {
      const root = document.getElementById('noticia-root');
      const params = new URLSearchParams(window.location.search);
      const requestedId = params.get('id');

      try {
        const response = await fetch(`${NOTICIAS_TSV_URL}&nocache=${Date.now()}`);
        if (!response.ok) throw new Error('Não foi possível carregar a planilha de notícias.');

        const tsv = await response.text();
        const noticias = parseTSV(tsv);

        if (!noticias.length) throw new Error('Nenhuma notícia foi encontrada na planilha.');

        const noticia = requestedId
          ? noticias.find(n => n.id === requestedId || slugify(n.titulo) === requestedId)
          : noticias[0];

        if (!noticia) {
          root.className = 'error';
          root.innerHTML = `
            <strong>Notícia não encontrada</strong>
            Confira se o ID da notícia está igual ao ID cadastrado na planilha.
            <br><br>
            <a class="back-btn" href="index.html">Voltar ao site</a>
          `;
          return;
        }

        renderArticle(noticia);
        renderMoreNews(noticias, noticia.id);
      } catch (error) {
        console.error('[noticia.html]', error);
        root.className = 'error';
        root.innerHTML = `
          <strong>Erro ao carregar notícia</strong>
          ${escapeHTML(error.message || 'Tente novamente em alguns instantes.')}
          <br><br>
          <a class="back-btn" href="index.html">Voltar ao site</a>
        `;
      }
    }

    loadNoticia();
  </script>
</body>
</html>
