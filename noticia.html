<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>
  (function () {
    if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/i.test(location.hostname)) {
      location.replace('https://' + location.host + location.pathname + location.search + location.hash);
    }
  })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícia | Central Free Fire</title>
  <meta name="description" content="Notícia da Central Free Fire.">
  <link rel="icon" type="image/webp" href="central free fire.webp">
  <link rel="stylesheet" href="css/bundle.min.css">
  <script defer src="js/config.min.js?v=20260607-noticia-dinamica-v3"></script>
  <style>
    body { background: var(--bg, #07101f); color: var(--text, #f5f8ff); }
    .news-page-shell { width: min(980px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 56px; }
    .news-topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
    .news-back { border:1px solid rgba(0,200,255,.25); background:rgba(0,200,255,.07); color:#fff; border-radius:999px; padding:10px 14px; font-weight:900; text-decoration:none; }
    .news-brand { display:flex; align-items:center; gap:10px; color:#8fb3dc; font-size:.82rem; font-weight:950; letter-spacing:1.2px; text-transform:uppercase; }
    .news-brand img { width:32px; height:32px; object-fit:contain; border-radius:8px; }
    .news-article { border:1px solid rgba(0,200,255,.16); border-radius:24px; background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02)); overflow:hidden; box-shadow:0 22px 80px rgba(0,0,0,.25); }
    .news-cover { width:100%; max-height:480px; object-fit:cover; display:block; background:#081323; }
    .news-content { padding: clamp(18px, 4vw, 38px); }
    .news-kicker { color:var(--accent, #00c8ff); font-size:.78rem; font-weight:1000; letter-spacing:1.8px; text-transform:uppercase; margin-bottom:10px; }
    .news-title { margin:0; color:#fff; font-size:clamp(1.9rem, 5vw, 3.25rem); line-height:1.02; font-weight:1000; letter-spacing:.02em; }
    .news-summary { color:#d7ecff; margin:14px 0 0; font-size:1.08rem; line-height:1.55; font-weight:650; }
    .news-meta { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 0; color:#8fb3dc; font-size:.85rem; font-weight:850; }
    .news-body { margin-top:26px; color:#eaf4ff; font-size:1.04rem; line-height:1.8; }
    .news-body p { margin:0 0 18px; }
    .news-body h2 { margin:30px 0 12px; color:#fff; font-size:clamp(1.35rem, 3.2vw, 1.9rem); line-height:1.18; font-weight:1000; letter-spacing:.01em; }
    .news-body h3 { margin:24px 0 10px; color:#dff4ff; font-size:clamp(1.12rem, 2.5vw, 1.45rem); line-height:1.25; font-weight:950; }
    .news-inline-image { margin:24px 0; border-radius:18px; overflow:hidden; border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.035); }
    .news-inline-image img { width:100%; display:block; object-fit:cover; }
    .news-inline-image figcaption { padding:9px 12px; color:#9db9d6; font-size:.82rem; font-weight:750; }
    .news-body .news-break { height:8px; }
    .news-body a, .news-original-link { color:var(--accent, #00c8ff); font-weight:900; }
    .news-original-link { display:inline-flex; margin-top:18px; text-decoration:none; border:1px solid rgba(0,200,255,.22); padding:10px 13px; border-radius:12px; background:rgba(0,200,255,.06); }
    .news-state { min-height:360px; display:flex; align-items:center; justify-content:center; text-align:center; color:#8fb3dc; font-weight:900; padding:20px; }
    @media (max-width: 680px) {
      .news-page-shell { width: min(100% - 18px, 980px); padding-top:14px; }
      .news-topbar { align-items:flex-start; flex-direction:column-reverse; }
      .news-cover { max-height:300px; }
      .news-content { padding:18px; }
      .news-title { font-size:2rem; }
    }
  </style>
</head>
<body>
  <main class="news-page-shell">
    <div class="news-topbar">
      <a class="news-back" href="/">← Voltar para a home</a>
      <div class="news-brand"><img src="central free fire.webp" alt="Central Free Fire">Central Free Fire</div>
    </div>
    <article id="noticia-dinamica" class="news-article">
      <div class="news-state">Carregando notícia...</div>
    </article>
  </main>

  <script>
  (function () {
    const fallbackImage = 'central free fire.webp';
    const root = document.getElementById('noticia-dinamica');

    function escapeHTML(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char];
      });
    }

    function slugify(value) {
      return String(value || '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase().replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function parseTSV(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let quoted = false;
      const src = String(text || '').replace(/^\uFEFF/, '');
      for (let i = 0; i < src.length; i++) {
        const char = src[i];
        const next = src[i + 1];
        if (char === '"') {
          if (quoted && next === '"') { cell += '"'; i++; }
          else quoted = !quoted;
        } else if (char === '\t' && !quoted) {
          row.push(cell.trim());
          cell = '';
        } else if ((char === '\n' || char === '\r') && !quoted) {
          if (char === '\r' && next === '\n') i++;
          row.push(cell.trim());
          if (row.some(function (item) { return String(item).trim() !== ''; })) rows.push(row);
          row = [];
          cell = '';
        } else {
          cell += char;
        }
      }
      row.push(cell.trim());
      if (row.some(function (item) { return String(item).trim() !== ''; })) rows.push(row);
      return rows;
    }

    function normalizeHeader(value) {
      return String(value || '').trim()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase().replace(/\s+/g, '_');
    }

    function driveImage(url) {
      let value = String(url || '').trim().replace(/\r/g, '');
      if (!value) return '';
      if (value.indexOf('drive.google.com') !== -1) {
        const match = value.match(/\/d\/([a-zA-Z0-9_-]+)/) || value.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) return 'https://drive.google.com/uc?export=view&id=' + match[1];
      }
      return value;
    }

    function firstField(item, keys) {
      for (const key of keys) {
        const normalized = normalizeHeader(key);
        if (item[normalized] != null && String(item[normalized]).trim()) return String(item[normalized]).trim();
      }
      return '';
    }

    function parseNoticias(text) {
      const rows = parseTSV(text);
      if (!rows.length) return [];
      const headers = rows[0].map(normalizeHeader);
      const hasHeaders = headers.includes('titulo') || headers.includes('conteudo') || headers.includes('resumo') || headers.includes('link_original');
      return rows.slice(1).map(function (cols, index) {
        const raw = {};
        if (hasHeaders) headers.forEach(function (header, i) { raw[header] = cols[i] || ''; });
        else Object.assign(raw, { imagem: cols[0] || '', titulo: cols[1] || '', link_original: cols[2] || '', destaque: cols[3] || '', conteudo: cols[4] || '' });
        const titulo = firstField(raw, ['titulo', 'title', 'manchete']);
        const id = firstField(raw, ['id', 'slug']) || slugify(titulo || ('noticia-' + (index + 1)));
        return {
          id: id,
          titulo: titulo,
          imagem: driveImage(firstField(raw, ['imagem', 'image', 'foto', 'capa', 'thumb'])),
          resumo: firstField(raw, ['resumo', 'subtitulo', 'descricao', 'description']),
          conteudo: firstField(raw, ['conteudo', 'texto', 'materia', 'matéria', 'noticia', 'notícia', 'body', 'article']),
          data: firstField(raw, ['data', 'date', 'publicado_em']),
          autor: firstField(raw, ['autor', 'author', 'fonte']),
          linkOriginal: firstField(raw, ['link_original', 'link', 'url', 'instagram'])
        };
      }).filter(function (item) { return item.titulo && item.id; });
    }

    function renderParagraph(text) {
      const clean = String(text || '').trim();
      if (!clean) return '';
      const lines = clean.split(/\r?\n/).map(escapeHTML).join('<br>');
      return '<p>' + lines + '</p>';
    }

    function renderInlineImage(url, caption) {
      const cleanUrl = driveImage(String(url || '').trim());
      if (!cleanUrl) return '';
      const cleanCaption = String(caption || '').trim();
      return '<figure class="news-inline-image"><img src="' + escapeHTML(cleanUrl) + '" alt="Imagem da notícia" loading="lazy" onerror="this.closest(\'figure\').remove()">' + (cleanCaption ? '<figcaption>' + escapeHTML(cleanCaption) + '</figcaption>' : '') + '</figure>';
    }

    function renderNewsBody(text) {
      let src = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
      if (!src) return '';
      src = src.replace(/\u000b/g, '\n').replace(/\u000c/g, '\n').replace(/\u0008/g, '').replace(/\t/g, ' ');

      const tokenRegex = /\[(P|PARAGRAFO|PARÁGRAFO|BR)\]|\[IMG\s*:\s*([^\]]+)\]|\[(H2|H3)\s*:?\s*([^\]]*)\]/gi;
      let html = '';
      let buffer = '';
      let lastIndex = 0;
      let match;

      function flushParagraph() {
        const paragraph = buffer.trim();
        if (paragraph) html += renderParagraph(paragraph);
        buffer = '';
      }

      while ((match = tokenRegex.exec(src)) !== null) {
        buffer += src.slice(lastIndex, match.index);
        flushParagraph();
        if (match[1]) {
          html += '<div class="news-break" aria-hidden="true"></div>';
        } else if (match[2]) {
          const parts = String(match[2]).split('|');
          const url = parts.shift() || '';
          const caption = parts.join('|').trim();
          html += renderInlineImage(url, caption);
        } else if (match[3]) {
          const level = String(match[3]).toLowerCase();
          const title = String(match[4] || '').trim();
          if (title) html += '<' + level + '>' + escapeHTML(title) + '</' + level + '>';
        }
        lastIndex = tokenRegex.lastIndex;
      }
      buffer += src.slice(lastIndex);
      flushParagraph();

      if (!html) html = src.split(/\n{2,}/).map(renderParagraph).join('');
      return html;
    }

    function setMeta(title, description, image) {
      document.title = title + ' | Central Free Fire';
      const desc = document.querySelector('meta[name="description"]');
      if (desc) desc.setAttribute('content', description || title);
      function ensure(attr, key, content) {
        let el = document.querySelector('meta[' + attr + '="' + key + '"]');
        if (!el) {
          el = document.createElement('meta');
          el.setAttribute(attr, key);
          document.head.appendChild(el);
        }
        el.setAttribute('content', content);
      }
      ensure('property', 'og:title', title);
      ensure('property', 'og:description', description || title);
      ensure('property', 'og:image', image || fallbackImage);
      ensure('property', 'og:type', 'article');
    }

    function renderNotFound() {
      root.innerHTML = '<div class="news-state">Notícia não encontrada.<br>Confira o endereço ou volte para a página inicial.</div>';
    }

    function renderNews(item) {
      const image = item.imagem || fallbackImage;
      setMeta(item.titulo, item.resumo, image);
      const body = renderNewsBody(item.conteudo || item.resumo || 'Conteúdo em atualização.');
      const meta = [item.data, item.autor].filter(Boolean).map(escapeHTML).join(' • ');
      root.innerHTML = '<div class="news-content">' +
        '<div class="news-kicker">Notícia</div>' +
        '<h1 class="news-title">' + escapeHTML(item.titulo) + '</h1>' +
        (item.resumo ? '<p class="news-summary">' + escapeHTML(item.resumo) + '</p>' : '') +
        (meta ? '<div class="news-meta">' + meta + '</div>' : '') +
        '<div class="news-body">' + body + '</div>' +
        (item.linkOriginal ? '<a class="news-original-link" href="' + escapeHTML(item.linkOriginal) + '" target="_blank" rel="noopener noreferrer">Ver publicação original →</a>' : '') +
        '</div>';
    }

    async function init() {
      try {
        const params = new URLSearchParams(location.search);
        const wanted = decodeURIComponent(params.get('id') || params.get('slug') || '').trim();
        if (!wanted) return renderNotFound();

        let wait = 0;
        while ((!window.CFF_CONFIG || !window.CFF_CONFIG.sheets) && wait < 80) {
          await new Promise(function (resolve) { setTimeout(resolve, 50); });
          wait++;
        }
        const sheetUrl = window.CFF_CONFIG && window.CFF_CONFIG.sheets && window.CFF_CONFIG.sheets.noticias;
        if (!sheetUrl) throw new Error('Configuração da planilha de notícias não encontrada.');

        const joiner = sheetUrl.indexOf('?') === -1 ? '?' : '&';
        const response = await fetch(sheetUrl + joiner + 'v=' + Math.floor(Date.now() / 300000), { cache: 'default' });
        if (!response.ok) throw new Error('Não foi possível carregar a planilha de notícias.');

        const noticias = parseNoticias(await response.text());
        const wantedSlug = slugify(wanted);
        const item = noticias.find(function (news) {
          return news.id === wanted || slugify(news.id) === wantedSlug || slugify(news.titulo) === wantedSlug;
        });
        if (!item) return renderNotFound();
        renderNews(item);
      } catch (error) {
        root.innerHTML = '<div class="news-state">Não foi possível carregar esta notícia agora.<br>Tente novamente em instantes.</div>';
        console.error(error);
      }
    }

    init();
  })();
  </script>
</body>
</html>
