<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>Redirecionando...</title>
  <script>
    (function () {
      'use strict';
      var path = window.location.pathname || '/';

      function safePart(value) {
        try { return decodeURIComponent(value || '').trim(); }
        catch (_) { return String(value || '').trim(); }
      }

      // Sorteios privados:
      // /sorteio-comunidade/2912391 -> /sorteio-comunidade.html?private=2912391
      var privateGiveawayMatch = path.match(/^\/sorteio-comunidade\/(\d{7})\/?$/i);
      if (privateGiveawayMatch && privateGiveawayMatch[1]) {
        window.location.replace('/sorteio-comunidade.html?private=' + encodeURIComponent(privateGiveawayMatch[1]) + '&v=20260930-private-eye-v2');
        return;
      }

      // URLs amigáveis de equipes:
      // /equipe/loud-snickers -> /equipe.html?time=loud-snickers
      var teamMatch = path.match(/^\/equipe\/([^\/]+)\/?$/i);
      if (teamMatch && teamMatch[1]) {
        var team = safePart(teamMatch[1]);
        if (team) {
          window.location.replace('/equipe.html?time=' + encodeURIComponent(team));
          return;
        }
      }

      // URLs amigáveis de jogadores:
      // /jogador/cauan7 -> /jogador.html?id=cauan7
      var playerMatch = path.match(/^\/jogador\/([^\/]+)\/?$/i);
      if (playerMatch && playerMatch[1]) {
        var player = safePart(playerMatch[1]);
        if (player) {
          window.location.replace('/jogador.html?id=' + encodeURIComponent(player));
          return;
        }
      }

      // URLs amigáveis de perfis:
      // /perfil/@nakataff -> /conta.html?ig=nakataff
      // /perfil/user128410 -> /conta.html?slug=user128410
      var profileMatch = path.match(/^\/perfil\/([^\/]+)\/?$/i);
      if (profileMatch && profileMatch[1]) {
        var profile = safePart(profileMatch[1]);
        if (/^@[a-z0-9_.]{1,64}$/i.test(profile)) {
          window.location.replace('/conta.html?ig=' + encodeURIComponent(profile.slice(1)));
          return;
        }
        if (/^user[0-9]{6,10}$/i.test(profile)) {
          window.location.replace('/conta.html?slug=' + encodeURIComponent(profile.toLowerCase()));
          return;
        }
      }

      // Mantém compatibilidade com as URLs de notícias já usadas pelo site.
      // /noticias/slug-da-noticia/ -> /noticia.html?id=slug-da-noticia
      var newsMatch = path.match(/^\/noticias\/([^\/]+)\/?$/i);
      if (newsMatch && newsMatch[1]) {
        var news = safePart(newsMatch[1]);
        if (news) {
          window.location.replace('/noticia.html?id=' + encodeURIComponent(news));
          return;
        }
      }

      // Compatibilidade adicional caso um link singular seja compartilhado no futuro.
      var newsSingleMatch = path.match(/^\/noticia\/([^\/]+)\/?$/i);
      if (newsSingleMatch && newsSingleMatch[1]) {
        var singleNews = safePart(newsSingleMatch[1]);
        if (singleNews) {
          window.location.replace('/noticia.html?id=' + encodeURIComponent(singleNews));
          return;
        }
      }

      // Comportamento antigo para qualquer outra rota desconhecida.
      try {
        sessionStorage.setItem('redirect', path + window.location.search + window.location.hash);
      } catch (_) {}
      window.location.replace('/');
    })();
  </script>
</head>
<body>
  <p>Redirecionando...</p>
  <script src="/js/site-analytics.js?v=20260806-admin-v1"></script>
<script type="module" src="/js/public-account.js?v=20261008-registration-v1"></script>
</body>
</html>
