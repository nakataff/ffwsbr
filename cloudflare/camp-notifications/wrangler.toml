name = "cff-camp-notifications"
main = "worker.js"
compatibility_date = "2026-10-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "NOTIFICATIONS"
class_name = "NotificationHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NotificationHub"]


# Read-only ranking queries use the existing database; no new database is created.
[[d1_databases]]
binding = "COMMUNITY_DB"
database_name = "cff-instagram-community"
database_id = "48e14987-34f9-4591-874f-c45c513dcb39"
