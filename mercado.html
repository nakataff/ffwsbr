  <div class="cff-public-left">
    <button class="cff-public-menu-button" id="cff-public-menu-open" type="button" aria-label="Abrir menu">☰</button>
    <div class="cff-public-teams">
      <button class="cff-public-teams-button" id="cff-public-teams-toggle" type="button" aria-expanded="false">EQUIPES ▼</button>
      <div class="cff-public-teams-dropdown" id="cff-public-teams-dropdown">
        <div class="cff-public-teams-grid" id="cff-public-teams-grid"></div>
      </div>
    </div>
  </div>
  <a class="cff-public-brand" href="index.html" aria-label="Ir para o início"><img src="central free fire.webp" alt="Central Free Fire"><span>CENTRAL FREE FIRE</span></a>
  <div class="cff-public-search"><div class="cff-public-search-row"><input id="cff-public-search-input" type="search" placeholder="BUSCAR JOGADOR, EQUIPE OU PÁGINA..." autocomplete="off" aria-label="Buscar no site"><button id="cff-public-search-submit" type="button" aria-label="Buscar">⌕</button></div><div id="cff-public-search-results" class="cff-public-search-results"></div></div>

<main id="mercado" class="mercado-page">
    <div class="mercado-header">
        <h1 class="mercado-title">Mercado da Bala</h1>
        <p class="mercado-subtitle">Transferências · Negociações · Rumores · Renovações</p>
    </div>

    <div class="mercado-filters" id="mercado-filters">
        <button type="button" class="mercado-filter-chip active" data-filter="all" aria-pressed="true" onclick="filterMercado(this, 'all')">📋 Todos</button>
        <button type="button" class="mercado-filter-chip" data-filter="rumor" aria-pressed="false" onclick="filterMercado(this, 'rumor')">
            <img alt="" decoding="async" loading="lazy" src="rumor.webp" onerror="this.style.display='none'"> Rumor
        </button>
        <button type="button" class="mercado-filter-chip" data-filter="negociando" aria-pressed="false" onclick="filterMercado(this, 'negociando')">
            <img alt="" decoding="async" loading="lazy" src="negociando.webp" onerror="this.style.display='none'"> Negociando
        </button>
        <button type="button" class="mercado-filter-chip" data-filter="fechado" aria-pressed="false" onclick="filterMercado(this, 'fechado')">
            <img alt="" decoding="async" loading="lazy" src="fechado.webp" onerror="this.style.display='none'"> Fechado
        </button>
        <button type="button" class="mercado-filter-chip" data-filter="falta-anunciar" aria-pressed="false" onclick="filterMercado(this, 'falta-anunciar')">
            <img alt="" decoding="async" loading="lazy" src="falta-anunciar.webp" onerror="this.style.display='none'"> Falta anunciar
        </button>
        <button type="button" class="mercado-filter-chip" data-filter="contrato-renovado" aria-pressed="false" onclick="filterMercado(this, 'contrato-renovado')">
            <img alt="" decoding="async" loading="lazy" src="contrato-renovado.webp" onerror="this.style.display='none'"> Contrato renovado
        </button>
        <button type="button" class="mercado-filter-chip" data-filter="melou" aria-pressed="false" onclick="filterMercado(this, 'melou')">
            <img alt="" decoding="async" loading="lazy" src="melou.webp" onerror="this.style.display='none'"> Melou
        </button>
    </div>

    <div class="filters" style="justify-content: center; margin-bottom: 25px;">
        <label for="mercado-team-filter" style="color: var(--text-muted); font-weight: bold;">Envolvendo a Equipe:</label>
        <select id="mercado-team-filter" onchange="renderMercado()" style="max-width: 300px; padding: 10px; font-size: 1em; border-radius: 8px; border: 1px solid var(--border); background: #0d1220; color: white; outline: none;">
            <option value="all">Todas as Equipes</option>
        </select>
    </div>

    <div id="mercado-list" class="mercado-list">
        <div class="mercado-empty" role="status">Carregando negociações...</div>
    </div>
<p class="mercado-page-back"><a href="/">← Voltar ao início</a></p>
