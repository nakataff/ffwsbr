<style>

ar(--accent);box-shadow:0 0 0 3px #7c5cff1e}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preview{padding:10px;border:1px solid #7c5cff48;border-radius:12px;background:#7c5cff14;text-align:center;font-weight:950;font-size:13px;text-transform:uppercase;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:11px 0}.head h2{font-size:15px;margin:0}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 8px;background:#0d1118;color:var(--muted);font-size:11px}.pill strong{color:#fff}.checks{display:grid;gap:8px;margin:12px 0}.check{display:flex;align-items:center;gap:8px;color:#d8deea;font-size:12px;font-weight:650}.check input{width:16px;height:16px;accent-color:var(--accent)}.divider{height:1px;background:var(--line);margin:14px 0}.list{display:grid;gap:7px;max-height:320px;overflow:auto}.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;border:1px solid var(--line);border-radius:11px;background:#0e1219;padding:8px}.person.off{opacity:.4}.pname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:850}.psub{font-size:10px;color:var(--muted)}.person-actions{display:flex;gap:4px;align-items:center}.person-actions select{width:auto;min-width:54px;padding:6px;font-size:11px}.icon{border:1px solid var(--line);background:#171c26;color:#fff;border-radius:9px;padding:6px 7px;font-size:11px}.tabs{display:flex;gap:6px;padding:7px;border:1px solid var(--line);border-radius:14px;background:#0d1118;margin-bottom:12px}.tab{flex:1;border:0;border-radius:10px;padding:10px;background:transparent;color:var(--muted);font-weight:900}.tab.active{background:#202735;color:#fff}.stage-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.status,.stage-actions{display:flex;gap:6px;flex-wrap:wrap}.banner{width:min(960px,100%);margin:0 auto 10px;padding:10px;border:1px solid var(--line);border-radius:13px;background:#0d1118;max-height:190px;overflow:auto}.banner.hidden{display:none}.event-title{text-align:center;font-weight:1000;text-transform:uppercase;font-size:clamp(15px,2vw,22px);margin-bottom:7px}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}.chip{border:1px solid #303a4d;border-radius:999px;background:#151b25;padding:5px 8px;font-size:10px;font-weight:750}.chip.used{opacity:.35;text-decoration:line-through}.wheel-wrap{position:relative;width:min(590px,86vw);aspect-ratio:1;margin:12px auto;display:grid;place-items:center}.wheel-shell{position:absolute;inset:0;padding:10px;border-radius:50%;background:linear-gradient(145deg,#293247,#0f131b);border:1px solid #394559;box-shadow:0 25px 60px #0007}canvas{display:block;width:100%;height:100%;border-radius:50%;transition:transform 5.5s cubic-bezier(.08,.74,.07,1)}.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);z-index:5;border-left:21px solid transparent;border-right:21px solid transparent;border-top:42px solid var(--cyan)}.center{position:absolute;z-index:4;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#202838,#0d1118);border:6px solid #303b4f;font-size:11px;font-weight:1000}.slot{display:none;padding:12px 0}.slot.show{display:block}.slot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(900px,100%);margin:auto}.slot-grid.one{grid-template-columns:minmax(280px,430px);justify-content:center}.slot-card{min-height:245px;border-radius:22px;border:1px solid #e6bf5573;background:linear-gradient(180deg,#24170a,#120d0a 24%,#24170a);padding:18px;display:grid;place-items:center;box-shadow:0 18px 45px #0006}.slot-machine{width:100%;padding:11px;border-radius:18px;background:linear-gradient(180deg,#f9d97b,#ae751d 12%,#57380e 50%,#b98127 86%,#f4d26f)}.slot-window{min-height:175px;border-radius:14px;background:linear-gradient(#f7efe0,#faf6ef 50%,#eee2cf);box-shadow:inset 0 0 25px #0005;display:grid;place-items:center;overflow:hidden}.slot-name{color:#2d1b08;text-align:center;font-size:clamp(24px,4vw,40px);font-weight:1000;padding:18px;word-break:break-word}.slot-name.spin{animation:slotPulse .12s linear infinite alternate}@keyframes slotPulse{from{transform:translateY(-4px);opacity:.45}to{transform:translateY(4px);opacity:1}}.spin{width:min(520px,100%);margin:12px auto 0;display:block;border:0;border-radius:15px;padding:15px 18px;background:linear-gradient(135deg,var(--accent),#4f75ff);color:#fff;font-weight:1000;font-size:16px}.winner{margin-top:14px;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;background:radial-gradient(circle at 50% 0,#7c5cff2b,transparent 48%),#0b0f15}.winner small{color:var(--muted);font-weight:900;letter-spacing:.12em;text-transform:uppercase}.winner-name{margin-top:6px;font-size:clamp(30px,6vw,64px);font-weight:1000;line-height:.95;letter-spacing:-.05em}.winner-meta{margin-top:7px;color:var(--muted);font-size:11px}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px auto 0;padding:11px;border:1px solid var(--line);border-radius:14px;background:#0d1118}.history{display:grid;gap:7px;max-height:220px;overflow:auto;margin-top:9px}.hist{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);background:#0d1118;border-radius:11px;padding:8px 10px;font-size:12px}.empty{padding:13px;border:1px dashed #313c50;border-radius:11px;color:var(--muted);text-align:center;font-size:12px}.toast{position:fixed;right:14px;bottom:14px;z-index:40;padding:10px 12px;border:1px solid #344057;border-radius:12px;background:#111722;box-shadow:var(--shadow);font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.presentation .top,.presentation .sidebar,.presentation .stage-head,.presentation .controls,.presentation .history-wrap{display:none!important}.presentation.app{width:100%;padding:8px}.presentation .layout{display:block}.presentation .panel{border:0;background:transparent;box-shadow:none}.presentation .inner{padding:5px}.presentation .winner{margin:4px auto 8px;width:min(900px,100%)}.presentation .wheel-wrap{width:min(70vh,78vw,590px)}@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar{order:2}.stage{order:1}}@media(max-width:700px){body{overflow-x:hidden}.app{width:100%;padding:9px 9px 26px}.top{flex-direction:column;align-items:stretch;gap:9px}.brand .mark{width:39px;height:39px;border-radius:11px}.brand h1{font-size:19px}.brand p{font-size:10px}.actions{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:6px}.actions .btn{width:100%;padding:8px 5px;font-size:11px}.actions #presentBtn{grid-column:1/-1}.layout{gap:10px}.sidebar{order:1}.stage{order:2}.panel{border-radius:15px}.inner{padding:11px}.row{grid-template-columns:1fr}.list{max-height:220px}.tabs{padding:5px;margin-bottom:9px}.tab{padding:8px 4px;font-size:11px}.stage-head{align-items:stretch}.stage-head>div{width:100%}.stage-actions .btn{flex:1;padding:7px 4px;font-size:10px}.banner{padding:8px;max-height:155px}.event-title{font-size:14px}.chip{font-size:9px;padding:4px 6px}.wheel-wrap{width:min(calc(100vw - 32px),420px);margin:9px auto}.wheel-shell{padding:7px}.center{width:70px;height:70px;border-width:4px;font-size:8px}.pointer{border-left-width:16px;border-right-width:16px;border-top-width:32px}.spin{padding:13px;font-size:14px}.winner{padding:13px 8px}.winner-name{font-size:clamp(28px,11vw,46px)}.controls{grid-template-columns:1fr;padding:9px}.slot-grid{grid-template-columns:1fr!important;gap:10px;width:min(100%,420px)}.slot-card{min-height:205px;padding:12px;border-radius:17px}.slot-window{min-height:145px}.slot-name{font-size:clamp(22px,9vw,34px)}.toast{left:9px;right:9px;bottom:9px;text-align:center}.presentation .wheel-wrap{width:min(calc(100vw - 24px),430px)}.presentation .banner{max-height:120px}}@media(max-width:390px){.brand p{display:none}.stage-actions{display:grid;grid-template-columns:1fr 1fr}.stage-actions .btn:last-child{grid-column:1/-1}}
</style>

<body>
<div class="app" id="app">
<header class="top"><div class="brand"><div class="mark">N</div><div><h1>SORTEADOR NAKATEAM</h1><p>Roleta + caça-níquel com prioridades, histórico e controle de repetição</p></div></div><div class="actions"><button class="btn" id="importBtn">📂 Carregar JSON</button><button class="btn" id="exportBtn">💾 Salvar JSON</button><button class="btn" id="presentBtn">🎬 Apresentação</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></header>
<main class="layout">
<aside class="panel sidebar"><div class="inner"><div class="field"><label>Nome do evento</label><input id="eventName" type="text" value="EVENTO VALENDO CODIGUINHO"></div><div class="preview" id="eventPreview">EVENTO VALENDO CODIGUINHO</div><div class="head"><h2>Participantes</h2><span class="pill"><strong id="count">0</strong>&nbsp;nomes</span></div><div class="field"><label>Cole os nomes</label><textarea id="names" placeholder="Nakata&#10;Matheus&#10;João&#10;Maria"></textarea></div><div class="row"><div class="field"><label>Separador</label><select id="sep"><option value="auto">Automático</option><option value="line">Linha</option><option value="comma">Vírgula</option><option value="semicolon">Ponto e vírgula</option><option value="tab">Tabulação</option></select></div><div class="field"><label>Prioridade padrão</label><select id="defaultWeight"><option value="1">1× Normal</option><option value="1.5">1,5×</option><option value="2">2×</option><option value="3">3×</option><option value="5">5×</option></select></div></div><button class="btn primary" id="add" style="width:100%">Adicionar nomes</button><div class="field" style="margin-top:12px"><label>🔎 Procurar participante</label><input id="search" type="text" placeholder="Digite um nome"></div><div class="checks"><label class="check"><input id="showParticipants" type="checkbox" checked> Mostrar participantes acima do sorteio</label><label class="check"><input id="noRepeat" type="checkbox" checked> Não repetir vencedores</label><label class="check"><input id="autoRemove" type="checkbox"> Desativar automaticamente quem ganhar</label></div><div class="divider"></div><div class="head"><h2>Lista</h2><button class="btn danger" id="clearList">Limpar</button></div><div class="list" id="people"></div></div></aside>
<section class="panel stage"><div class="inner"><div class="tabs"><button class="tab active" data-mode="wheel">🎡 ROLETA</button><button class="tab" data-mode="slot">🎰 CAÇA-NÍQUEL</button></div><div class="stage-head"><div class="status"><span class="pill"><strong id="eligible">0</strong>&nbsp;disponíveis</span><span class="pill"><strong id="winnerCount">0</strong>&nbsp;sorteados</span></div><div class="stage-actions"><button class="btn" id="undo">↩ Desfazer</button><button class="btn danger" id="clearWinners">Limpar vencedores</button><button class="btn danger" id="clearAll">🧹 Limpar tudo</button></div></div><div class="banner" id="banner"><div class="event-title" id="stageTitle">EVENTO VALENDO CODIGUINHO</div><div class="chips" id="chips"></div></div><div id="wheelArea"><div class="wheel-wrap"><div class="pointer"></div><div class="wheel-shell"><canvas id="wheel" width="1000" height="1000"></canvas></div><div class="center">SORTEADOR<br>NAKATEAM</div></div></div><div class="slot" id="slotArea"><div class="slot-grid one" id="slotGrid"><div class="slot-card"><div class="slot-machine"><div class="slot-window"><div class="slot-name" id="slot1">—</div></div></div></div><div class="slot-card" id="slotCard2" hidden><div class="slot-machine"><div class="slot-window"><div class="slot-name" id="slot2">—</div></div></div></div></div></div><button class="spin" id="spin">🎯 GIRAR ROLETA</button><div class="winner"><small>Vencedor</small><div class="winner-name" id="winnerName">—</div><div class="winner-meta" id="winnerMeta">—</div></div><div class="controls"><div><label>Vencedores</label><select id="qty"><option value="1">1 vencedor</option><option value="2">2 vencedores</option><option value="3">3 vencedores</option><option value="5">5 vencedores</option></select></div><div><label>Duração</label><select id="duration"><option value="3">3 s</option><option value="4">4 s</option><option value="5.5" selected>5,5 s</option><option value="7">7 s</option></select></div><div><label>Emoji</label><select id="emoji"><option value="on">Com emoji</option><option value="off">Sem emoji</option></select></div></div><div class="divider history-wrap"></div><div class="head history-wrap"><h2>Histórico de vencedores</h2></div><div class="history history-wrap" id="history"></div></div></section>
</main></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],emojis=['🔥','⚡','🎯','🏆','💎','🚀','🐺','🦁','🦅','🐉','🥷','⭐','💥','🎮'];const colors=['#7c5cff','#20c997','#3b82f6','#f59e0b','#ef5da8','#06b6d4','#8b5cf6','#22c55e','#f97316','#e879f9'];let people=[],winners=[],mode='wheel',rot=0,busy=false;const canvas=$('#wheel'),ctx=canvas.getContext('2d');const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1800)}function parse(){let raw=$('#names').value,sep=$('#sep').value,a;if(sep==='line')a=raw.split(/\r?\n/);else if(sep==='comma')a=raw.split(',');else if(sep==='semicolon')a=raw.split(';');else if(sep==='tab')a=raw.split('\t');else a=/\r?\n/.test(raw)?raw.split(/\r?\n/):raw.includes('\t')?raw.split('\t'):raw.includes(',')?raw.split(','):raw.split(';');return [...new Set(a.map(x=>x.trim().replace(/\s+/g,' ')).filter(Boolean))]}function activeWinners(){return winners.filter(w=>!w.undone)}function eligible(){const used=new Set(activeWinners().map(w=>w.pid));return people.filter(p=>p.enabled&&(!$('#noRepeat').checked||p.repeat||!used.has(p.id)))}function pick(list){let total=list.reduce((s,p)=>s+Number(p.weight||1),0),r=Math.random()*total;for(const p of list){r-=Number(p.weight||1);if(r<=0)return p}return list.at(-1)}function label(p){return $('#emoji').value==='off'?p.name:`${p.emoji} ${p.name}`}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderPeople(){const q=norm($('#search').value),box=$('#people');box.innerHTML='';const rows=people.filter(p=>!q||norm(p.name).includes(q));if(!rows.length){box.innerHTML='<div class="empty">Nenhum participante encontrado</div>';return}rows.forEach(p=>{const d=document.createElement('div');d.className='person'+(p.enabled?'':' off');d.innerHTML=`<div><div class="pname">${p.emoji} ${esc(p.name)}</div><div class="psub">${p.enabled?'Ativo':'Desativado'} • ${String(p.weight).replace('.',',')}×</div></div><div class="person-actions"><select aria-label="Prioridade"><option value="1">1×</option><option value="1.5">1,5×</option><option value="2">2×</option><option value="3">3×</option><option value="5">5×</option></select><button class="icon toggle">${p.enabled?'✓':'○'}</button><button class="icon remove">✕</button></div>`;const s=d.querySelector('select');s.value=String(p.weight);s.onchange=()=>{p.weight=+s.value;render()};d.querySelector('.toggle').onclick=()=>{p.enabled=!p.enabled;render()};d.querySelector('.remove').onclick=()=>{people=people.filter(x=>x.id!==p.id);render()};box.appendChild(d)})}function draw(){const list=eligible();ctx.clearRect(0,0,1000,1000);if(!list.length){ctx.fillStyle='#171c26';ctx.beginPath();ctx.arc(500,500,480,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9aa5b5';ctx.font='700 34px system-ui';ctx.textAlign='center';ctx.fillText('ADICIONE PARTICIPANTES',500,515);return}const n=list.length,a=Math.PI*2/n;list.forEach((p,i)=>{ctx.beginPath();ctx.moveTo(500,500);ctx.arc(500,500,480,i*a,(i+1)*a);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.save();ctx.translate(500,500);ctx.rotate(i*a+a/2);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font=`900 ${n>24?18:n>16?23:30}px system-ui`;let text=label(p);if(text.length>20)text=text.slice(0,19)+'…';ctx.fillText(text,445,10);ctx.restore()})}function render(){const el=eligible();$('#count').textContent=people.length;$('#eligible').textContent=el.length;$('#winnerCount').textContent=activeWinners().length;const title=$('#eventName').value.trim()||'SORTEADOR NAKATEAM';$('#eventPreview').textContent=$('#stageTitle').textContent=title;$('#banner').classList.toggle('hidden',!$('#showParticipants').checked);$('#chips').innerHTML=people.map(p=>`<span class="chip ${el.includes(p)?'':'used'}">${p.emoji} ${esc(p.name)}${p.weight>1?` • ${String(p.weight).replace('.',',')}×`:''}</span>`).join('');renderPeople();draw();const h=activeWinners();$('#history').innerHTML=h.length?h.slice().reverse().map((w,i)=>`<div class="hist"><strong>${h.length-i}º • ${esc(w.name)}</strong><span>${w.time}</span></div>`).join(''):'<div class="empty">Nenhum vencedor ainda</div>'}const wait=ms=>new Promise(r=>setTimeout(r,ms));function award(p,kind){const time=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});winners.push({id:id(),pid:p.id,name:p.name,emoji:p.emoji,time,kind,undone:false});if($('#autoRemove').checked)p.enabled=false;$('#winnerName').textContent=label(p);$('#winnerMeta').textContent=`${kind} • ${time}`}async function spinWheel(){let list=eligible(),qty=Math.min(+$('#qty').value,list.length);if(!qty)return toast('Adicione participantes');busy=true;$('#spin').disabled=true;for(let k=0;k<qty;k++){list=eligible();if(!list.length)break;const p=pick(list),idx=list.indexOf(p),slice=360/list.length,target=360-(idx*slice+slice/2)-90,turns=5+Math.floor(Math.random()*3),dur=(+$('#duration').value)*1000;rot+=turns*360+((target-rot)%360+360)%360;canvas.style.transition=`transform ${dur}ms cubic-bezier(.08,.74,.07,1)`;canvas.style.transform=`rotate(${rot}deg)`;await wait(dur+120);award(p,'Roleta');if(k<qty-1)await wait(450)}busy=false;$('#spin').disabled=false;render()}async function spinSlot(){let list=eligible(),qty=Math.min(+$('#qty').value,2,list.length);if(!qty)return toast('Adicione participantes');busy=true;$('#spin').disabled=true;$('#slotCard2').hidden=qty<2;$('#slotGrid').classList.toggle('one',qty<2);for(let k=0;k<qty;k++){const out=k?$('#slot2'):$('#slot1');out.classList.add('spin');const started=Date.now(),dur=Math.max(1800,+$('#duration').value*700);while(Date.now()-started<dur){const e=eligible();if(!e.length)break;out.textContent=label(e[Math.floor(Math.random()*e.length)]);await wait(80)}const e=eligible();if(!e.length)break;const p=pick(e);out.textContent=label(p);out.classList.remove('spin');award(p,'Caça-níquel');await wait(350)}busy=false;$('#spin').disabled=false;render()}function spin(){if(busy)return;mode==='wheel'?spinWheel():spinSlot()}$('#add').onclick=()=>{const names=parse(),seen=new Set(people.map(p=>norm(p.name)));let n=0;for(const name of names){if(seen.has(norm(name)))continue;people.push({id:id(),name,emoji:emojis[Math.floor(Math.random()*emojis.length)],weight:+$('#defaultWeight').value||1,enabled:true,repeat:false});seen.add(norm(name));n++}$('#names').value='';render();toast(`${n} participante${n===1?'':'s'} adicionado${n===1?'':'s'}`)};$('#search').oninput=renderPeople;$('#eventName').oninput=render;$('#showParticipants').onchange=render;$('#noRepeat').onchange=render;$('#emoji').onchange=render;$('#clearList').onclick=()=>{if(confirm('Remover todos os participantes?')){people=[];render()}};$('#clearWinners').onclick=()=>{winners=[];$('#winnerName').textContent='—';$('#winnerMeta').textContent='—';render()};$('#undo').onclick=()=>{const w=[...winners].reverse().find(x=>!x.undone);if(!w)return toast('Nada para desfazer');w.undone=true;const p=people.find(x=>x.id===w.pid);if(p)p.enabled=true;render()};$('#clearAll').onclick=()=>{if(confirm('Limpar participantes e vencedores?')){people=[];winners=[];rot=0;canvas.style.transition='none';canvas.style.transform='rotate(0deg)';$('#winnerName').textContent='—';$('#winnerMeta').textContent='—';render()}};$('#spin').onclick=spin;$$('.tab').forEach(b=>b.onclick=()=>{if(busy)return;mode=b.dataset.mode;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));$('#wheelArea').style.display=mode==='wheel'?'block':'none';$('#slotArea').classList.toggle('show',mode==='slot');$('#spin').textContent=mode==='wheel'?'🎯 GIRAR ROLETA':'🎰 GIRAR CAÇA-NÍQUEL';if(mode==='slot'&&+$('#qty').value>2)$('#qty').value='2'});$('#qty').onchange=()=>{if(mode==='slot'&&+$('#qty').value>2)$('#qty').value='2'};$('#presentBtn').onclick=()=>{const on=!$('#app').classList.contains('presentation');$('#app').classList.toggle('presentation',on);$('#presentBtn').textContent=on?'⚙️ Voltar aos controles':'🎬 Apresentação';setTimeout(draw,60)};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#app').classList.contains('presentation'))$('#presentBtn').click();if(e.code==='Space'&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName)){e.preventDefault();spin()}});$('#exportBtn').onclick=()=>{const data={app:'SORTEADOR NAKATEAM',version:3,people,winners,config:{eventName:$('#eventName').value,showParticipants:$('#showParticipants').checked,noRepeat:$('#noRepeat').checked,autoRemove:$('#autoRemove').checked,mode,qty:+$('#qty').value,duration:+$('#duration').value,emoji:$('#emoji').value}};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sorteador-nakateam-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);people=(d.people||d.participants||[]).map(p=>({id:p.id||id(),name:String(p.name||'').trim(),emoji:p.emoji||emojis[0],weight:+p.weight||1,enabled:p.enabled!==false,repeat:!!p.repeat||!!p.canRepeat})).filter(p=>p.name);winners=Array.isArray(d.winners)?d.winners:[];const c=d.config||{};$('#eventName').value=c.eventName||'EVENTO VALENDO CODIGUINHO';$('#showParticipants').checked=c.showParticipants!==false;$('#noRepeat').checked=c.noRepeat!==false&&c.blockRepeat!==false;$('#autoRemove').checked=!!c.autoRemove;$('#qty').value=String([1,2,3,5].includes(+c.qty)?+c.qty:1);$('#duration').value=String(c.duration||5.5);$('#emoji').value=c.emoji==='off'||c.emojiMode==='off'?'off':'on';render();toast('Backup carregado')}ca
