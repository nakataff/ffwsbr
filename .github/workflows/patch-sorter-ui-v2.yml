name: Patch sorter UI v2

on:
  push:
    paths:
      - '.github/workflows/patch-sorter-ui-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject sorter and admin enhancements
        run: |
          python - <<'PY'
          from pathlib import Path

          sorter = Path('sorteador/index.html')
          text = sorter.read_text(encoding='utf-8')
          tag = '<script src="../js/sorteador-chance-highlight.js?v=20260915-chance-highlight-v1"></script>'
          if 'sorteador-chance-highlight.js' not in text:
              if '</body>' not in text:
                  raise SystemExit('sorter </body> not found')
              text = text.replace('</body>', tag + '\n</body>', 1)
              sorter.write_text(text, encoding='utf-8')

          admin = Path('admin-sorteio-comunidade.html')
          text = admin.read_text(encoding='utf-8')
          tag = '<script src="js/admin-giveaway-shortcuts.js?v=20260915-sorter-shortcut-v1"></script>'
          if 'admin-giveaway-shortcuts.js' not in text:
              if '</body>' not in text:
                  raise SystemExit('admin </body> not found')
              text = text.replace('</body>', tag + '\n</body>', 1)
              admin.write_text(text, encoding='utf-8')
          PY
          node --check js/sorteador-chance-highlight.js
          node --check js/admin-giveaway-shortcuts.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sorteador/index.html admin-sorteio-comunidade.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Exibe chances na roleta e adiciona atalho no admin"
          git push
