name: Test team history and shared logos
on:
  push:
    branches: [main]
    paths:
      - 'js/historical-teams.min.js'
      - 'js/career-client.mjs'
      - 'js/career-public.js'
      - 'js/other-tournaments.min.js'
      - 'js/career-team-identities.mjs'
      - 'js/team-identity-history.js'
      - 'js/tournament-logos.js'
      - 'js/tournament-assets-admin.mjs'
      - 'data/tournament-assets.json'
      - 'scripts/build-tournament-assets.py'
      - 'test/tournament-assets-ui.test.cjs'
      - 'test/career-team-identities.test.cjs'
      - 'imports/liquipedia-worlds/**'
      - 'scripts/import-liquipedia-worlds.py'
      - 'scripts/build-tournament-catalog.py'
      - 'test/liquipedia-worlds.test.cjs'
      - 'novos-torneios/index.json'
      - 'novos-torneios/ffws-*.json'
      - 'novos-torneios/radar-*.json'
      - 'js/team-routes.mjs'
      - 'js/team-page-fast.min.js'
      - 'css/careers.css'
      - 'team-data/historical/**'
      - 'team-data/historical-index.json'
      - 'team-data/history/**'
      - 'scripts/build-team-views.py'
      - 'scripts/snapshot-career-s2.cjs'
      - 'career-data/events/**'
      - 'test/team-career-views.test.cjs'
      - 'test/team-profile.test.cjs'
      - 'dados laff/**'
      - 'laff-2025-s1-finals.json'
      - 'resultados.json'
      - 'js/career-results.mjs'
      - 'career-data/results/**'
      - 'scripts/build-career-results.py'
      - 'functions/career-seed.json'
      - 'functions/career-staff-history.json'
      - 'functions/career-staff-s2.json'
      - 'novos-torneios/lbff-*.json'
      - 'novos-torneios/wb-2024.json'
      - 'team-results-2026.json'
      - 'ewc 2026/team-profiles.json'
      - 'ewc 2026/times.json'
      - 'ewc 2026/datas.json'
      - 'ffws-br-2026-*/teams.json'
      - 'ffws-br-2026-s2/radar-summary.json'
      - 'ffws-br-2026-s2/career-summary.json'
      - 'test/career-results.test.cjs'
      - 'js/year-ranking-logo-sheet.js'
      - 'js/team-logo-resolver.min.js'
      - 'team-data/historical-teams.json'
      - 'team-data/logo-map.json'
      - 'team-aliases.json'
      - 'novos-torneios/wb-2025-*.json'
      - 'test/historical-team-fixes.test.cjs'
      - 'test/global-team-logos.test.cjs'
      - '.github/workflows/test-team-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          mkdir -p /tmp/cff-team-history-test
          cp test/game-gifts-browser-package.json /tmp/cff-team-history-test/package.json
          npm install --prefix /tmp/cff-team-history-test --no-audit --no-fund
      - name: Check data, logo refresh and normal team links
        env:
          NODE_PATH: /tmp/cff-team-history-test/node_modules
        run: node --test --test-timeout=10000 test/historical-team-fixes.test.cjs test/career-team-identities.test.cjs test/global-team-logos.test.cjs test/team-profile.test.cjs test/tournament-logos.test.cjs test/tournament-assets-ui.test.cjs test/career-results.test.cjs test/team-career-views.test.cjs test/liquipedia-worlds.test.cjs
      - name: Check imported world sources and lightweight tournament catalogue
        run: python3 scripts/import-liquipedia-worlds.py --check && python3 scripts/build-tournament-catalog.py --check
      - name: Check generated canonical team views
        run: python3 scripts/build-team-views.py --check && python3 scripts/build-tournament-assets.py --check
      - name: Check changed browser modules
        run: node --check js/historical-teams.min.js && node --check js/year-ranking-logo-sheet.js && node --check js/team-logo-resolver.min.js && node --check js/career-client.mjs && node --check js/career-results.mjs && node --check js/career-public.js
