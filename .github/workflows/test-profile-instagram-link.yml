name: Test Profile Instagram Link Status
on:
  push:
    branches: [main]
    paths:
      - 'js/public-account.js'
      - 'js/profile-instagram-link.mjs'
      - 'css/community-profile.css'
      - 'test/profile-instagram-link.test.mjs'
      - '.github/workflows/test-profile-instagram-link.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: node --check js/public-account.js && node --check js/profile-instagram-link.mjs
      - run: node --test test/profile-instagram-link.test.mjs
