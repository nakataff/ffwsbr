name: Daily profile shortcuts tests
on:
  push:
    paths:
      - 'js/daily-tasks.mjs'
      - 'js/public-account.js'
      - 'js/mobile-dock.js'
      - 'js/profile-checkin.mjs'
      - 'js/daily-quiz.mjs'
      - 'css/daily-tasks.css'
      - 'test/daily-tasks.test.cjs'
      - '.github/workflows/daily-tasks-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/cff-daily-tests --no-save --no-audit --no-fund jsdom@26.1.0
      - run: node --test test/daily-tasks.test.cjs test/daily-quiz.test.cjs test/quiz-invite.test.cjs test/profile-inventory.test.cjs test/mercado-page.test.cjs test/quiz-goals-ui.test.cjs
        env:
          NODE_PATH: /tmp/cff-daily-tests/node_modules
      - run: node --check js/public-account.js && node --check js/mobile-dock.js && node --check js/daily-tasks.mjs && node --check js/profile-checkin.mjs
