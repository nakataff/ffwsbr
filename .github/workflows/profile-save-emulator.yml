name: Test Profile Save With Firebase Emulator
on:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'firebase.json'
      - 'js/public-account.js'
      - 'functions/test/profile-save-emulator.cjs'
      - 'functions/test/global-chat-emulator.cjs'
      - 'functions/test/code-gifts-emulator.cjs'
      - '.github/workflows/profile-save-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save @firebase/rules-unit-testing firebase
        working-directory: functions
      - run: npm install -g firebase-tools
      - run: firebase emulators:exec --config firebase.json --project demo-profile-save --only database 'node functions/test/profile-save-emulator.cjs && node functions/test/global-chat-emulator.cjs && node functions/test/code-gifts-emulator.cjs'
