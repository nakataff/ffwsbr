name: Test tournament overviews and annual ranking
on:
  push:
    branches: [main]
    paths:
      - 'ranking-anual.html'
      - 'ranking-data/**'
      - 'css/annual-ranking.css'
      - 'js/annual-ranking.mjs'
      - 'scripts/build-annual-ranking.cjs'
      - 'test/annual-ranking.test.cjs'
      - 'ffws-br-2026-s1/stages.json'
      - 'ewc 2026/final.json'
      - 'ffws-global-2026/stages.json'
      - 'ffws-br-2026-s2/inicio*'
      - 'ffws-br-s2/inicio/**'
      - 'ffws-br-2026-s2/players.json'
      - 'ffws-br-2026-s2/player-name-map.json'
      - 'ffws-br-2026-s2/career-summary.json'
      - 'scripts/build-s2-overview.cjs'
      - 'js/ffws-live-provider.js'
      - 'test/s2-overview.test.cjs'
      - 'test/ranking-share-cards.test.cjs'
      - 'js/ranking-share-*.mjs'
      - 'js/home-share-cards.js'
      - 'css/ranking-share-cards.css'
      - 'js/vendor/qrcode*'
      - '.github/workflows/test-s2-overview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install isolated DOM test dependency
        run: npm install --prefix /tmp/cff-overview-tests jsdom@26.1.0 @napi-rs/canvas@0.1.100 jsqr@1.4.0 --no-audit --no-fund
      - name: Check syntax and exercise static data and tabs
        env:
          NODE_PATH: /tmp/cff-overview-tests/node_modules
        run: |
          node --check js/annual-ranking.mjs
          node --check scripts/build-annual-ranking.cjs
          node scripts/build-annual-ranking.cjs --check
          node --check ffws-br-2026-s2/inicio.js
          node --check scripts/build-s2-overview.cjs
          node --check js/site-shell-fast.min.js
          node --check js/ranking-share-cards.mjs
          node --check js/ranking-share-renderer.mjs
          node --check js/ranking-share-model.mjs
          node --test test/annual-ranking.test.cjs test/s2-overview.test.cjs test/ranking-share-cards.test.cjs
