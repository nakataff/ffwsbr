name: Patch Instagram checkin debug

on:
  push:
    paths:
      - '.github/workflows/patch-instagram-checkin-debug.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add temporary Meta diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('cloudflare/instagram-community/worker.js')
          s = worker.read_text(encoding='utf-8')

          marker = "async function fetchMessageUsername(messageId, accessToken) {"
          if 'async function diagnoseMetaRequest(' not in s:
              helper = r"""async function diagnoseMetaRequest(base, objectId, fields, accessToken) {
            const result = {
              base: base.includes('facebook.com') ? 'facebook' : 'instagram',
              status: 0,
              ok: false,
              username: '',
              error: null,
            };
            if (!objectId || !accessToken) {
              result.error = { message: !objectId ? 'missing_object_id' : 'missing_access_token' };
              return result;
            }
            try {
              const url = new URL(`${base}/${GRAPH_VERSION}/${encodeURIComponent(objectId)}`);
              url.searchParams.set('fields', fields);
              url.searchParams.set('access_token', accessToken);
              const response = await fetch(url.toString(), { headers: { Accept: 'application/json' } });
              result.status = response.status;
              let data = null;
              try { data = await response.json(); } catch (_) {}
              result.ok = Boolean(response.ok && data && !data.error);
              result.username = cleanUsername(data?.username || data?.from?.username);
              if (data?.error) {
                result.error = {
                  message: String(data.error.message || '').slice(0, 220),
                  type: String(data.error.type || '').slice(0, 80),
                  code: Number(data.error.code || 0) || 0,
                  subcode: Number(data.error.error_subcode || 0) || 0,
                };
              } else if (!response.ok) {
                result.error = { message: `HTTP ${response.status}` };
              }
            } catch (error) {
              result.error = { message: String(error?.message || error || 'fetch_failed').slice(0, 220) };
            }
            return result;
          }

          async function buildCheckinDiagnostic(identity, messageId, accessToken) {
            const identityAttempts = [];
            for (const base of ['https://graph.instagram.com', 'https://graph.facebook.com']) {
              identityAttempts.push(await diagnoseMetaRequest(base, identity, 'id,name,username', accessToken));
            }
            const messageAttempts = [];
            if (messageId) {
              for (const base of ['https://graph.instagram.com', 'https://graph.facebook.com']) {
                messageAttempts.push(await diagnoseMetaRequest(base, messageId, 'id,from', accessToken));
              }
            }
            return {
              senderIdSuffix: String(identity || '').slice(-8),
              senderIdLength: String(identity || '').length,
              identity: identityAttempts,
              message: messageAttempts,
              at: Date.now(),
            };
          }

          async function saveCheckinDiagnostic(env, diagnostic, sessionId = '') {
            try {
              const payload = JSON.stringify({ sessionId: String(sessionId || '').slice(0, 64), ...diagnostic });
              await env.DB.prepare('INSERT INTO raw_events (kind, payload, received_at) VALUES (?1, ?2, ?3)')
                .bind('checkin_debug', payload, Date.now()).run();
            } catch (_) {}
          }

          """
              if marker not in s:
                  raise SystemExit('fetchMessageUsername marker not found')
              s = s.replace(marker, helper + marker, 1)

          old = """  if (!username) {
            const knownSession = await env.DB.prepare(`
              SELECT username
              FROM checkin_sessions
              WHERE instagram_id = ?1
                AND username IS NOT NULL
                AND username != ''
                AND username NOT LIKE 'usuario_%'
              ORDER BY verified_at DESC
              LIMIT 1
            `).bind(identity).first();
            username = cleanUsername(knownSession?.username);
          }

          const result = await env.DB.prepare(`
          """
          new = """  if (!username) {
            const knownSession = await env.DB.prepare(`
              SELECT username
              FROM checkin_sessions
              WHERE instagram_id = ?1
                AND username IS NOT NULL
                AND username != ''
                AND username NOT LIKE 'usuario_%'
              ORDER BY verified_at DESC
              LIMIT 1
            `).bind(identity).first();
            username = cleanUsername(knownSession?.username);
          }

          if (!username) {
            const diagnostic = await buildCheckinDiagnostic(identity, messageId, env.INSTAGRAM_ACCESS_TOKEN);
            await saveCheckinDiagnostic(env, diagnostic, pending.session_id);
            console.log('[checkin-debug]', JSON.stringify(diagnostic));
          }

          const result = await env.DB.prepare(`
          """
          if old not in s:
              raise SystemExit('verification diagnostic marker not found')
          s = s.replace(old, new, 1)

          old2 = """  const { dayKey } = dateKeys(now);
          const awardKey = `checkin:${row.user_key}:${dayKey}`;
          const award = await env.DB.prepare('SELECT 1 AS found FROM awards WHERE award_key = ?1 LIMIT 1').bind(awardKey).first();
          return json({ ok: true, status: 'verified', username: resolvedUsername || row.username, checkedInToday: Boolean(award?.found), dayKey, checkinPoints: RULES.checkinPoints }, 200, request);
          """
          new2 = """  let debug = null;
          if (!resolvedUsername || /^usuario_/i.test(resolvedUsername)) {
            debug = await buildCheckinDiagnostic(row.instagram_id, '', env.INSTAGRAM_ACCESS_TOKEN);
            await saveCheckinDiagnostic(env, debug, sessionId);
          }

          const { dayKey } = dateKeys(now);
          const awardKey = `checkin:${row.user_key}:${dayKey}`;
          const award = await env.DB.prepare('SELECT 1 AS found FROM awards WHERE award_key = ?1 LIMIT 1').bind(awardKey).first();
          return json({ ok: true, status: 'verified', username: resolvedUsername || row.username, checkedInToday: Boolean(award?.found), dayKey, checkinPoints: RULES.checkinPoints, debug }, 200, request);
          """
          if old2 not in s:
              raise SystemExit('checkinStatus response marker not found')
          s = s.replace(old2, new2, 1)
          worker.write_text(s, encoding='utf-8')

          front = Path('js/community-checkin.js')
          f = front.read_text(encoding='utf-8')
          old3 = """    const unresolved = !username || /^usuario_/i.test(username);
            root.innerHTML = `
          """
          new3 = """    const unresolved = !username || /^usuario_/i.test(username);
            const attempts = Array.isArray(data?.debug?.identity) ? data.debug.identity : [];
            const debugText = unresolved && attempts.length
              ? attempts.map((item) => {
                  const code = item?.error?.code ? ` #${item.error.code}${item?.error?.subcode ? '/' + item.error.subcode : ''}` : '';
                  const msg = item?.error?.message ? `: ${item.error.message}` : (item?.username ? `: @${item.username}` : '');
                  return `${item.base || 'graph'} ${item.status || 0}${code}${msg}`;
                }).join(' | ')
              : '';
            root.innerHTML = `
          """
          if old3 not in f:
              raise SystemExit('front unresolved marker not found')
          f = f.replace(old3, new3, 1)

          old4 = """      <p class=\"cff-checkin-help ${unresolved ? 'cff-checkin-error' : ''}\">${unresolved ? 'A Meta confirmou a conta, mas não devolveu o @ corretamente. Gere um novo código e envie novamente pela conta certa.' : (checked ? 'Você já garantiu o ponto de hoje. Volte amanhã para pontuar de novo.' : 'Tudo certo. Seu Instagram já está confirmado neste navegador.')}</p>
            <div class=\"cff-checkin-actions\">
          """
          new4 = """      <p class=\"cff-checkin-help ${unresolved ? 'cff-checkin-error' : ''}\">${unresolved ? 'A Meta confirmou a conta, mas não devolveu o @ corretamente. Gere um novo código e envie novamente pela conta certa.' : (checked ? 'Você já garantiu o ponto de hoje. Volte amanhã para pontuar de novo.' : 'Tudo certo. Seu Instagram já está confirmado neste navegador.')}</p>
            ${debugText ? `<p class=\"cff-checkin-help\" style=\"margin-top:-4px;word-break:break-word;opacity:.85\"><strong>Diagnóstico Meta:</strong> ${esc(debugText)}</p>` : ''}
            <div class=\"cff-checkin-actions\">
          """
          if old4 not in f:
              raise SystemExit('front help marker not found')
          f = f.replace(old4, new4, 1)
          front.write_text(f, encoding='utf-8')
          PY

          node --check cloudflare/instagram-community/worker.js
          node --check js/community-checkin.js

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/instagram-community/worker.js js/community-checkin.js
          git commit -m "Adiciona diagnóstico temporário do vínculo do Instagram"
          git push
