name: Patch Instagram checkin debug

on:
  push:
    paths:
      - '.github/workflows/patch-instagram-checkin-debug.yml'
      - '.github/scripts/patch_instagram_debug.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply temporary Meta diagnostics
        run: python .github/scripts/patch_instagram_debug.py

      - name: Validate JavaScript
        run: |
          node --check cloudflare/instagram-community/worker.js
          node --check js/community-checkin.js

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/instagram-community/worker.js js/community-checkin.js
          git commit -m "Adiciona diagnóstico temporário do vínculo do Instagram"
          git push
