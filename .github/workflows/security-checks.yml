name: Security checks

on:
  pull_request:
    paths:
      - 'database.rules.json'
      - 'firebase-database-rules-admin.example.json'
      - 'functions/test/security-public-rules.test.cjs'
      - 'functions/test/profile-community-rules.test.cjs'
      - 'manager.js'
      - 'manager.html'
      - '.github/workflows/security-checks.yml'
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'functions/test/security-public-rules.test.cjs'
      - '.github/workflows/security-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JSON and JavaScript
        run: |
          node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase-database-rules-admin.example.json','utf8'))"
          node --check manager.js
      - name: Security and profile regression tests
        run: node --test functions/test/security-public-rules.test.cjs functions/test/profile-community-rules.test.cjs functions/test/profile-save.test.cjs test/profile-community.test.mjs test/profile-story-card.test.mjs
