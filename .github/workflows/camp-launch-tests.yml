name: Camp launch UI tests
on:
  push:
    paths:
      - 'admin-camp-ao-vivo.html'
      - 'admin-camp-ao-vivo/app-loader.js'
      - 'admin-camp-ao-vivo/workspace.*'
      - 'admin-camp-ao-vivo/tournament-setup.js'
      - 'admin-camp-ao-vivo/final-wiki.js'
      - 'admin-camp-ao-vivo/enhancements.js'
      - 'admin-camp-ao-vivo/launch-extras.js'
      - 'admin-camp-ao-vivo/placement-live.js'
      - 'admin-camp-ao-vivo/app.js.gz'
      - 'admin-camp-ao-vivo/elimination-focus.js'
      - 'test/camp-*.test.cjs'
      - '.github/workflows/camp-launch-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/cff-camp-tests --no-save --no-audit --no-fund jsdom@26.1.0
      - run: node --test --test-concurrency=1 test/camp-*.test.cjs
        env:
          NODE_PATH: /tmp/cff-camp-tests/node_modules
      - run: node --check admin-camp-ao-vivo/launch-extras.js && node --check admin-camp-ao-vivo/placement-live.js && node --check admin-camp-ao-vivo/tournament-setup.js && node --check admin-camp-ao-vivo/workspace.js && node --check admin-camp-ao-vivo/app-loader.js
