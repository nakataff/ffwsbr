name: Check community JavaScript

on:
  push:
    paths:
      - '.github/workflows/check-community-js.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check js/community-prediction.js
          node --check js/community-promos.js
          node --check js/admin-giveaway-priority.js
          node --check cloudflare/instagram-community/worker.js
