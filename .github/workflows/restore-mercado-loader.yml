name: Restore Mercado loader

on:
  push:
    paths:
      - '.github/workflows/restore-mercado-loader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Mercado scripts on production index
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          marker = '<script defer src="js/site-analytics.js?v=20260806-admin-v1"></script>'
          mercado = '<script defer src="js/charts-market.min.js?v=20260917-restore-mercado-v1"></script>'
          votes = '<script type="module" src="js/firebase-votes.min.js?v=20260917-restore-mercado-v1"></script>'

          if mercado not in text:
              if marker not in text:
                  raise SystemExit('site-analytics marker not found in index.html')
              text = text.replace(marker, mercado + '\n' + votes + '\n' + marker, 1)
          elif votes not in text:
              text = text.replace(mercado, mercado + '\n' + votes, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit fix
        run: |
          rm -f .github/workflows/restore-mercado-loader.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-mercado-loader.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Restaura Mercado da Bala e votos no site"
          git push