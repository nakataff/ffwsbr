name: Patch community upgrades

on:
  push:
    paths:
      - '.github/workflows/patch-community-upgrades.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply community upgrades
        run: python .github/scripts/community_upgrades.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/instagram-community/worker.js index.html interacoes.html admin-sorteio-comunidade.html sorteador/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Ajusta data do bônus combo dos palpites"
          git push
