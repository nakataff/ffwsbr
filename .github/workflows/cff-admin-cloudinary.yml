name: Ativa upload Cloudinary no admin

on:
  push:
    paths:
      - '.github/workflows/cff-admin-cloudinary.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrar upload no admin
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          text = p.read_text(encoding='utf-8')
          tag = '  <script defer src="js/admin-image-upload.js?v=20260905-cloudinary-v1"></script>\n'
          if 'js/admin-image-upload.js' not in text:
              marker = '  <script type="module" src="js/admin.js?v=20260902-news-schedule-v27"></script>\n'
              if marker not in text:
                  raise SystemExit('Marcador do admin.js não encontrado em admin.html')
              text = text.replace(marker, tag + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validar integração
        shell: bash
        run: |
          node --check js/admin-image-upload.js
          grep -q 'js/admin-image-upload.js?v=20260905-cloudinary-v1' admin.html

      - name: Commitar e remover workflow temporário
        shell: bash
        run: |
          rm -f .github/workflows/cff-admin-cloudinary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html js/admin-image-upload.js .github/workflows/cff-admin-cloudinary.yml
          if git diff --cached --quiet; then
            echo "Nada para commitar"
            exit 0
          fi
          git commit -m "Integra upload Cloudinary no painel de notícias"
          git push origin HEAD:main
