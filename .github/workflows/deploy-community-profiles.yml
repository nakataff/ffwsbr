name: Deploy Profile Database Rules
on:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'functions/admin-profile-editor.js'
      - 'functions/admin-profile-options.json'
      - '.github/workflows/deploy-community-profiles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - run: npm install -g firebase-tools
      - run: npm install
        working-directory: functions
      - run: node --test functions/test/admin-profile-editor.test.cjs
      - run: firebase deploy --only database --project central-free-fire --non-interactive
