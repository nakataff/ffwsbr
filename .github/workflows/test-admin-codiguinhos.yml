name: Test Codiguinhos Admin
on:
  push:
    branches: [main]
    paths:
      - 'admin-codiguinhos.html'
      - 'js/admin-code*'
      - 'js/admin-codiguinhos*'
      - 'js/admin-economy-stock.js'
      - 'js/economy-ui.js'
      - 'js/economy-shop.mjs'
      - 'js/header-wallet.mjs'
      - 'test/economy-shop.test.cjs'
      - 'test/header-wallet.test.cjs'
      - 'css/admin-codiguinhos-ui.css'
      - 'functions/code-gifts.js'
      - 'functions/test/code-gifts.test.cjs'
      - 'test/admin-code*'
      - 'test/code-vouchers-ui.test.cjs'
      - 'test/code-returns-ui.test.cjs'
      - 'js/code-return.mjs'
      - '.github/workflows/test-admin-codiguinhos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install isolated DOM test dependency
        run: |
          mkdir -p /tmp/cff-codes-test
          cp test/game-gifts-browser-package.json /tmp/cff-codes-test/package.json
          npm install --prefix /tmp/cff-codes-test --no-audit --no-fund
      - name: Test private status reconciliation, stock filters and gift dialog
        env:
          NODE_PATH: /tmp/cff-codes-test/node_modules
        run: node --test --test-timeout=10000 test/economy-shop.test.cjs test/header-wallet.test.cjs test/admin-codiguinhos.test.cjs test/code-vouchers-ui.test.cjs test/code-returns-ui.test.cjs test/admin-code-gift-sync.test.mjs functions/test/code-gifts.test.cjs
