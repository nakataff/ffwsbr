name: Deploy Free Camp Notifications
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/camp-notifications/**'
      - 'functions/camp-notifications-core.js'
      - '.github/workflows/deploy-free-camp-notifications.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Check Cloudflare access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Add CLOUDFLARE_API_TOKEN in repository Actions secrets.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Add CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.'; exit 1; }
      - run: npm install --no-audit --no-fund
        working-directory: cloudflare/camp-notifications
      - run: npm test
        working-directory: cloudflare/camp-notifications
      - name: Deploy the standalone free Worker
        run: npm run deploy
        working-directory: cloudflare/camp-notifications
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confirm the public service
        run: |
          # A new workers.dev route can briefly return 404 during propagation.
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 15 --output health.json https://cff-camp-notifications.nakataffb4.workers.dev/health
          node -e 'const h = JSON.parse(require("node:fs").readFileSync("health.json", "utf8")); if (h.ok !== true || h.service !== "cff-camp-notifications") throw new Error("Notification health check failed"); console.log("Notification service is ready.");'
