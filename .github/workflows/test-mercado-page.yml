name: Test standalone Mercado page
on:
  workflow_dispatch:
  push:
    paths:
      - 'mercado.html'
      - 'index.html'
      - 'css/mercado.css'
      - 'js/mercado-page.js'
      - 'js/team-logo-resolver.min.js'
      - 'team-data/logo-map.json'
      - 'js/mercado-votes.mjs'
      - 'js/root-page-redirects.js'
      - 'js/shared-navigation.js'
      - 'js/mobile-dock.js'
      - 'js/site-shell-fast.min.js'
      - 'js/charts-market.min.js'
      - 'js/mercado-status-performance-hotfix.min.js'
      - 'test/mercado-page.test.cjs'
      - 'test/career-market-public.test.cjs'
      - '.github/workflows/test-mercado-page.yml'
  pull_request:
    paths:
      - 'mercado.html'
      - 'css/mercado.css'
      - 'js/mercado-page.js'
      - 'js/team-logo-resolver.min.js'
      - 'team-data/logo-map.json'
      - 'js/mercado-votes.mjs'
      - 'js/root-page-redirects.js'
      - 'test/mercado-page.test.cjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM runtime
        run: |
          mkdir -p /tmp/cff-mercado-tests
          cp test/game-gifts-browser-package.json /tmp/cff-mercado-tests/package.json
          npm install --prefix /tmp/cff-mercado-tests --no-audit --no-fund
      - name: Check migration and feed compatibility
        env:
          NODE_PATH: /tmp/cff-mercado-tests/node_modules
        run: node --test test/mercado-page.test.cjs test/career-market-public.test.cjs
      - name: Check syntax
        run: node --check js/team-logo-resolver.min.js && node --check js/mercado-page.js && node --check js/mercado-votes.mjs && node --check js/root-page-redirects.js && node --check js/shared-navigation.js && node --check js/mobile-dock.js && node --check js/site-shell-fast.min.js
