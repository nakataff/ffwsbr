name: Test Global Finals format
on:
  workflow_dispatch:
  push:
    paths:
      - 'ffws-global-2026/**'
      - 'js/season-routes.js'
      - 'js/shared-navigation.js'
      - 'css/shared-navigation.css'
      - 'js/home-global-finals.js'
      - 'js/home-support.js'
      - 'js/home-supporters.js'
      - 'js/supporters-admin.mjs'
      - 'js/admin-supporters.js'
      - 'css/admin-supporters.css'
      - 'admin-apoiadores.html'
      - 'test/community-supporters-ui.test.cjs'
      - 'css/home-global-finals.css'
      - 'js/site-shell-fast.min.js'
      - 'index.html'
      - 'test/global-format-2026.test.cjs'
      - 'test/global-overview.test.cjs'
      - 'test/global-teams.test.cjs'
      - 'scripts/build-global-overview.cjs'
      - 'scripts/build-global-players.cjs'
      - 'test/global-players.test.cjs'
      - 'test/global-player-bridge.test.cjs'
      - 'js/global-player-profile.js'
      - 'js/global-player-manifest.js'
      - 'css/global-player-profile.css'
      - 'js/player-page.min.js'
      - 'jogador.html'
      - 'test/home-global-matchups.test.cjs'
      - 'test/home-support.test.cjs'
      - '.github/workflows/test-global-format.yml'
  pull_request:
    paths:
      - 'ffws-global-2026/**'
      - 'test/global-format-2026.test.cjs'
      - 'test/global-overview.test.cjs'
      - 'test/global-teams.test.cjs'
      - 'scripts/build-global-overview.cjs'
      - 'scripts/build-global-players.cjs'
      - 'test/global-players.test.cjs'
      - 'test/global-player-bridge.test.cjs'
      - 'js/global-player-profile.js'
      - 'js/global-player-manifest.js'
      - 'css/global-player-profile.css'
      - 'js/player-page.min.js'
      - 'jogador.html'
jobs:
  global-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test runtime
        run: |
          mkdir -p /tmp/cff-global-tests
          cp test/game-gifts-browser-package.json /tmp/cff-global-tests/package.json
          npm install --prefix /tmp/cff-global-tests --no-audit --no-fund
      - name: Validate format, calendar and rendering
        env:
          NODE_PATH: /tmp/cff-global-tests/node_modules
        run: node --test test/global-players.test.cjs test/global-player-bridge.test.cjs test/global-teams.test.cjs test/global-overview.test.cjs test/global-format-2026.test.cjs test/home-global-matchups.test.cjs test/global-team-logos.test.cjs test/tournament-logos.test.cjs test/home-support.test.cjs test/community-supporters-ui.test.cjs test/admin-dashboard.test.cjs
      - name: Check generated overview
        run: node scripts/build-global-overview.cjs --check && node scripts/build-global-players.cjs --check
      - name: Check syntax
        run: node --check ffws-global-2026/jogadores.js && node --check js/global-player-profile.js && node --check scripts/build-global-players.cjs && node --check js/player-page.min.js && node --check ffws-global-2026/equipes.js && node --check ffws-global-2026/inicio.js && node --check scripts/build-global-overview.cjs && node --check ffws-global-2026/global.js && node --check ffws-global-2026/config.js && node --check js/season-routes.js && node --check js/shared-navigation.js && node --check js/home-global-finals.js && node --check js/home-supporters.js && node --check js/admin-supporters.js && node --check js/supporters-admin.mjs && node --check js/home-support.js && node --check js/site-shell-fast.min.js
