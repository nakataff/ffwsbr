name: Atualiza notícias com sidebar e URL amigável
on:
  push:
    paths:
      - '.github/workflows/cff-news-pretty-sidebar.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajustes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('noticia.html')
          s = p.read_text(encoding='utf-8')

          if '<base href="/">' not in s:
              s = s.replace('<head>\n', '<head>\n  <base href="/">\n', 1)

          s = s.replace('href="css/bundle.min.css"', 'href="css/bundle.min.css?v=20260904-sidebar-nested-v22"')
          s = s.replace('src="js/news-admin-provider.js?v=20260902-news-schedule-v27"', 'src="js/news-admin-provider.js?v=20260905-pretty-news-v38"')

          sidebar_script = '  <script defer src="js/news-index-sidebar.js?v=20260905-index-sidebar-v1"></script>\n'
          anchor = '  <script defer src="js/news-admin-provider.js?v=20260905-pretty-news-v38"></script>\n'
          if 'news-index-sidebar.js' not in s:
              s = s.replace(anchor, anchor + sidebar_script, 1)

          css_anchor = '    .news-topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }\n'
          css_extra = '''    .news-topbar-left { display:flex; align-items:center; gap:10px; min-width:0; }\n    .news-sidebar-trigger { display:inline-flex; align-items:center; gap:8px; min-height:40px; border:1px solid rgba(0,200,255,.28); background:rgba(0,200,255,.08); color:#fff; border-radius:12px; padding:9px 12px; font-weight:950; cursor:pointer; }\n    .news-sidebar-trigger span { color:var(--accent,#00c8ff); font-size:1.15rem; line-height:1; }\n    .news-sidebar-trigger b { font-size:.78rem; letter-spacing:.8px; }\n'''
          if '.news-sidebar-trigger {' not in s:
              s = s.replace(css_anchor, css_anchor + css_extra, 1)

          mobile_old = "      .news-topbar { align-items:flex-start; flex-direction:column-reverse; }"
          mobile_new = "      .news-topbar { align-items:flex-start; }\n      .news-topbar-left { flex-wrap:wrap; }\n      .news-sidebar-trigger b { display:none; }"
          s = s.replace(mobile_old, mobile_new)

          old_init = """        const params = new URLSearchParams(location.search);\n        const wanted = decodeURIComponent(params.get('id') || params.get('slug') || '').trim();\n        if (!wanted) return renderNotFound();\n"""
          new_init = """        const params = new URLSearchParams(location.search);\n        const pathMatch = location.pathname.match(/^\\/noticia\\/([^\\/]+)\\/?$/i);\n        const rawWanted = params.get('id') || params.get('slug') || (pathMatch && pathMatch[1]) || '';\n        const wanted = decodeURIComponent(rawWanted).trim();\n        if (!wanted) return renderNotFound();\n        const prettyPath = '/noticia/' + encodeURIComponent(wanted);\n        if (location.pathname !== prettyPath || location.search) history.replaceState(null, '', prettyPath);\n"""
          if old_init in s:
              s = s.replace(old_init, new_init, 1)
          elif 'const pathMatch = location.pathname.match' not in s:
              raise SystemExit('Bloco init não encontrado em noticia.html')

          meta_anchor = "      ensure('property', 'og:type', 'article');\n"
          meta_extra = """      ensure('property', 'og:url', location.href);\n      let canonical = document.querySelector('link[rel=\"canonical\"]');\n      if (!canonical) { canonical = document.createElement('link'); canonical.rel = 'canonical'; document.head.appendChild(canonical); }\n      canonical.href = location.origin + location.pathname;\n"""
          if "ensure('property', 'og:url'" not in s:
              s = s.replace(meta_anchor, meta_anchor + meta_extra, 1)

          p.write_text(s, encoding='utf-8')

          p = Path('js/news-admin-provider.js')
          s = p.read_text(encoding='utf-8')
          old = "urlInterna: 'noticia.html?id=' + encodeURIComponent(id)"
          new = "urlInterna: '/noticia/' + encodeURIComponent(id)"
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('urlInterna não encontrada em news-admin-provider.js')
          p.write_text(s, encoding='utf-8')
          PY

          node --check js/news-index-sidebar.js
          grep -q 'news-index-sidebar.js' noticia.html
          grep -q "'/noticia/' + encodeURIComponent(id)" js/news-admin-provider.js
          grep -q 'pathMatch = location.pathname.match' noticia.html
      - name: Commitar ajustes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/cff-news-pretty-sidebar.yml
          git add noticia.html js/news-admin-provider.js js/news-index-sidebar.js .github/workflows/cff-news-pretty-sidebar.yml
          git commit -m "Adiciona sidebar do index e URLs amigáveis às notícias"
          git push
