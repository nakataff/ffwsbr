name: Patch Instagram checkin username

on:
  push:
    paths:
      - '.github/workflows/patch-instagram-checkin-username.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Instagram username fallback fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('cloudflare/instagram-community/worker.js')
          s = p.read_text(encoding='utf-8')

          helper_marker = "async function fetchMediaTimestamp(mediaId, accessToken) {"
          helper_lines = [
              "async function fetchInstagramUsername(identity, accessToken) {",
              "  if (!identity || !accessToken) return '';",
              "  try {",
              "    const url = new URL(`https://graph.instagram.com/${GRAPH_VERSION}/${encodeURIComponent(identity)}`);",
              "    url.searchParams.set('fields', 'id,username');",
              "    url.searchParams.set('access_token', accessToken);",
              "    const response = await fetch(url.toString(), { headers: { Accept: 'application/json' } });",
              "    if (!response.ok) return '';",
              "    const data = await response.json();",
              "    return cleanUsername(data?.username);",
              "  } catch (_) {",
              "    return '';",
              "  }",
              "}",
              "",
          ]
          if 'async function fetchInstagramUsername(' not in s:
              if helper_marker not in s:
                  raise SystemExit('fetchMediaTimestamp marker not found')
              s = s.replace(helper_marker, '\n'.join(helper_lines) + helper_marker, 1)

          old_lines = [
              "  let username = cleanUsername(event?.sender?.username);",
              "  const messageId = String(message?.mid || '');",
              "  if (!username && messageId) username = await fetchMessageUsername(messageId, env.INSTAGRAM_ACCESS_TOKEN);",
              "  const key = await userKey(identity, username);",
              "  const result = await env.DB.prepare(`",
              "    UPDATE checkin_sessions",
              "    SET user_key = ?1, instagram_id = ?2, username = ?3, verified_at = ?4, expires_at = 0",
              "    WHERE session_id = ?5 AND verified_at IS NULL",
              "  `).bind(key, identity, username || fallbackUsername(identity), now, pending.session_id).run();",
          ]
          old = '\n'.join(old_lines)

          new_lines = [
              "  let username = cleanUsername(event?.sender?.username);",
              "  const messageId = String(message?.mid || '');",
              "",
              "  // 1) Alguns webhooks não trazem sender.username. Tenta recuperar pelo ID da mensagem.",
              "  if (!username && messageId) username = await fetchMessageUsername(messageId, env.INSTAGRAM_ACCESS_TOKEN);",
              "",
              "  // 2) Se a mensagem também não devolver o @, consulta diretamente o Instagram-scoped ID do remetente.",
              "  if (!username) username = await fetchInstagramUsername(identity, env.INSTAGRAM_ACCESS_TOKEN);",
              "",
              "  const key = await userKey(identity, username);",
              "",
              "  // 3) Último fallback: reaproveita um @ real já conhecido para este mesmo Instagram ID.",
              "  if (!username) {",
              "    const knownAward = await env.DB.prepare(`",
              "      SELECT username",
              "      FROM awards",
              "      WHERE user_key = ?1",
              "        AND username IS NOT NULL",
              "        AND username != ''",
              "        AND username NOT LIKE 'usuario_%'",
              "      ORDER BY created_at DESC",
              "      LIMIT 1",
              "    `).bind(key).first();",
              "    username = cleanUsername(knownAward?.username);",
              "  }",
              "",
              "  if (!username) {",
              "    const knownSession = await env.DB.prepare(`",
              "      SELECT username",
              "      FROM checkin_sessions",
              "      WHERE instagram_id = ?1",
              "        AND username IS NOT NULL",
              "        AND username != ''",
              "        AND username NOT LIKE 'usuario_%'",
              "      ORDER BY verified_at DESC",
              "      LIMIT 1",
              "    `).bind(identity).first();",
              "    username = cleanUsername(knownSession?.username);",
              "  }",
              "",
              "  const result = await env.DB.prepare(`",
              "    UPDATE checkin_sessions",
              "    SET user_key = ?1, instagram_id = ?2, username = ?3, verified_at = ?4, expires_at = 0",
              "    WHERE session_id = ?5 AND verified_at IS NULL",
              "  `).bind(key, identity, username || fallbackUsername(identity), now, pending.session_id).run();",
          ]
          new = '\n'.join(new_lines)

          if old not in s:
              raise SystemExit('processCheckinVerification marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          node --check cloudflare/instagram-community/worker.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/instagram-community/worker.js
          git commit -m "Corrige identificação do @ no check-in do Instagram"
          git push
