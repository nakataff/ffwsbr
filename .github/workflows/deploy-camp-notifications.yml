name: Deploy Camp Notifications
on:
  push:
    branches: [main]
    paths:
      - 'functions/camp-notifications*.js'
      - '.github/workflows/deploy-camp-notifications.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - run: npm install -g firebase-tools
      - run: npm install
        working-directory: functions
      - run: npm run test:notifications
        working-directory: functions
      - run: firebase deploy --only database,functions:campNotificationApi,functions:campNotificationDeliver,functions:campNotificationOfficial --project central-free-fire --non-interactive
