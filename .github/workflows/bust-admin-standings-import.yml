name: Bust admin standings import cache

on:
  push:
    paths:
      - '.github/workflows/bust-admin-standings-import.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch admin cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace('js/admin.js?v=20260917-live-channel-link-v28','js/admin.js?v=20260917-standings-import-v29')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm -f .github/workflows/bust-admin-standings-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/bust-admin-standings-import.yml
          git commit -m "Atualiza cache do painel para importar tabelas"
          git push
