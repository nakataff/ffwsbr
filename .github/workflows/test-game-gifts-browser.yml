name: Test Browser Gift Demo
on:
  push:
    branches: [main]
    paths:
      - 'admin-presentes-teste.html'
      - 'js/game-gifts-browser-*.mjs'
      - 'css/game-gifts-browser-lab.css'
      - 'test/game-gifts-browser-*'
      - '.github/workflows/test-game-gifts-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install isolated DOM test dependency
        run: |
          mkdir -p /tmp/cff-browser-gift-tests
          cp test/game-gifts-browser-package.json /tmp/cff-browser-gift-tests/package.json
          npm install --prefix /tmp/cff-browser-gift-tests --no-audit --no-fund
      - name: Test browser demo and actual UI
        env:
          NODE_PATH: /tmp/cff-browser-gift-tests/node_modules
        run: node --test test/game-gifts-browser-lab.test.mjs test/game-gifts-browser-ui.test.cjs
      - run: node --check js/game-gifts-browser-lab.mjs && node --check js/game-gifts-browser-ui.mjs
