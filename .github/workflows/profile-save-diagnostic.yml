name: Diagnose Profile Save (Read Only)
on:
  workflow_dispatch:
    inputs:
      username:
        description: Profile username to inspect without changing production data
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - run: npm install
        working-directory: functions
      - run: node functions/profile-save-diagnostic.cjs
        env:
          PROFILE_DIAGNOSTIC_USERNAME: ${{ inputs.username }}
          PROFILE_DIAGNOSTIC_FIXTURE: ${{ runner.temp }}/profile-save-fixture.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save @firebase/rules-unit-testing firebase
        working-directory: functions
      - run: npm install -g firebase-tools
      - run: firebase emulators:exec --config firebase.json --project demo-profile-save --only database 'node functions/test/profile-save-emulator.cjs'
        env:
          PROFILE_DIAGNOSTIC_FIXTURE: ${{ runner.temp }}/profile-save-fixture.json
