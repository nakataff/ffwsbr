name: Patch sorter deferred winner

on:
  push:
    paths:
      - '.github/workflows/patch-sorter-deferred-winner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sorter deferred winner behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('sorteador/index.html')
          t = p.read_text(encoding='utf-8')

          old = "let people=[],winners=[],mode='wheel',rot=0,busy=false,parsedWeights=new Map();"
          new = "let people=[],winners=[],mode='wheel',rot=0,busy=false,parsedWeights=new Map(),heldWinnerPid=null;"
          if old in t:
              t = t.replace(old, new, 1)

          old = "function eligible(){const used=new Set(activeWinners().map(w=>w.pid));return people.filter(p=>p.enabled&&(!$('#noRepeat').checked||p.repeat||!used.has(p.id)))}function pick"
          new = "function eligible(){const used=new Set(activeWinners().map(w=>w.pid));return people.filter(p=>p.enabled&&(!$('#noRepeat').checked||p.repeat||!used.has(p.id)))}function wheelVisible(){const base=eligible();if(!heldWinnerPid||!$('#noRepeat').checked)return base;const held=people.find(p=>p.id===heldWinnerPid&&p.enabled);if(!held||base.some(p=>p.id===held.id))return base;const allowed=new Set(base.map(p=>p.id));allowed.add(held.id);return people.filter(p=>p.enabled&&allowed.has(p.id))}function pick"
          if old not in t and 'function wheelVisible()' not in t:
              raise SystemExit('eligible marker not found')
          if old in t:
              t = t.replace(old, new, 1)

          t = t.replace('function draw(){const list=eligible();', 'function draw(){const list=wheelVisible();', 1)

          pattern = re.compile(r"function award\(p,kind\)\{.*?\}async function spinWheel", re.S)
          repl = "function award(p,kind){const time=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});winners.push({id:id(),pid:p.id,name:p.name,emoji:p.emoji,time,kind,undone:false});if($('#autoRemove').checked)p.enabled=false;heldWinnerPid=kind==='Roleta'&&$('#noRepeat').checked&&!p.repeat&&p.enabled?p.id:null;if(heldWinnerPid)document.body.dataset.cffHeldWinner=label(p);else delete document.body.dataset.cffHeldWinner;$('#winnerName').textContent=label(p);$('#winnerMeta').textContent=`${kind} • ${time}`}async function spinWheel"
          t, count = pattern.subn(lambda _: repl, t, count=1)
          if count != 1:
              raise SystemExit('award block not replaced')

          t = t.replace("for(let k=0;k<qty;k++){list=eligible();", "for(let k=0;k<qty;k++){if(k>0){heldWinnerPid=null;delete document.body.dataset.cffHeldWinner;render()}list=eligible();", 1)
          t = t.replace("function spin(){if(busy)return;mode==='wheel'?spinWheel():spinSlot()}", "function spin(){if(busy)return;heldWinnerPid=null;delete document.body.dataset.cffHeldWinner;render();mode==='wheel'?spinWheel():spinSlot()}", 1)
          t = t.replace("$('#noRepeat').onchange=render;", "$('#noRepeat').onchange=()=>{if(!$('#noRepeat').checked){heldWinnerPid=null;delete document.body.dataset.cffHeldWinner}render()};", 1)
          t = t.replace("$('#clearWinners').onclick=()=>{winners=[];", "$('#clearWinners').onclick=()=>{winners=[];heldWinnerPid=null;delete document.body.dataset.cffHeldWinner;", 1)
          t = t.replace("w.undone=true;const p=people.find(x=>x.id===w.pid);", "w.undone=true;if(heldWinnerPid===w.pid){heldWinnerPid=null;delete document.body.dataset.cffHeldWinner}const p=people.find(x=>x.id===w.pid);", 1)
          t = t.replace("if(confirm('Limpar participantes e vencedores?')){people=[];winners=[];", "if(confirm('Limpar participantes e vencedores?')){people=[];winners=[];heldWinnerPid=null;delete document.body.dataset.cffHeldWinner;", 1)
          t = re.sub(r'sorteador-chance-highlight\.js\?v=[^\"\']+', 'sorteador-chance-highlight.js?v=20260915-chance-highlight-v3', t, count=1)
          p.write_text(t, encoding='utf-8')

          q = Path('js/sorteador-chance-highlight.js')
          s = q.read_text(encoding='utf-8')
          s = s.replace('__CFF_SORTER_CHANCE_HIGHLIGHT_V2__', '__CFF_SORTER_CHANCE_HIGHLIGHT_V3__')
          if 'function wheelDisplayChips()' not in s:
              marker = '  function highlightChip(chip) {'
              helper = '''  function wheelDisplayChips() {\n    const chips = [...document.querySelectorAll('#chips .chip')];\n    const held = String(document.body.dataset.cffHeldWinner || '').trim();\n    return chips.filter((chip) => !chip.classList.contains('used') || (held && parseChip(chip).label === held));\n  }\n\n'''
              if marker not in s:
                  raise SystemExit('highlight marker not found')
              s = s.replace(marker, helper + marker, 1)
          s = s.replace("    const active = [...document.querySelectorAll('#chips .chip:not(.used)')];", "    const active = wheelDisplayChips();", 1)
          q.write_text(s, encoding='utf-8')
          PY
          node --check js/sorteador-chance-highlight.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sorteador/index.html js/sorteador-chance-highlight.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Mantém vencedor na roleta até o próximo giro"
          git push
