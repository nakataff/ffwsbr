name: Compare two public interaction scores
on:
  push:
    branches:
      - diagnostic/interaction-cl4rinharss-vs-ldzinnrlq-20261025
permissions:
  contents: read
jobs:
  public-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Query only two named public profiles
        shell: bash
        run: |
          node <<'JS'
          const base='https://cff-instagram-community.nakataffb4.workers.dev';
          const wanted=['cl4rinharss.07','ldzinnrlq_2'];
          async function data(uri){const r=await fetch(base+uri,{signal:AbortSignal.timeout(30000),headers:{accept:'application/json'}});if(!r.ok)throw Error(uri+' status='+r.status+' '+(await r.text()).slice(0,400));return r.json();}
          (async()=>{
            for(const [name,uri] of [['peers','/api/community/peers?period=week&usernames='+wanted.map(encodeURIComponent).join(',')],['ranking','/api/ranking?period=week']]){
              const r=await data(uri);
              if(name==='peers') console.log('PUBLIC_PEERS',JSON.stringify(r));
              else {
                const rows=Object.entries(r.users||{}).map(([key,v])=>({key,...v}));
                console.log('PERIOD',JSON.stringify(r.period),'UPDATED',r.updatedAt,'RULES',JSON.stringify(r.rules));
                console.log('TWO_USERS',JSON.stringify(rows.filter(v=>wanted.includes(String(v.username||'').toLowerCase()))));
                console.log('TOP_COUNT',rows.length);
              }
            }
          })().catch(e=>{console.error('CHECK_ERROR',e.message);process.exitCode=1});
          JS
