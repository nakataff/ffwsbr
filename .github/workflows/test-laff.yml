name: LAFF loading and team catalogue
on:
  push:
    paths:
      - 'js/laff.min.js'
      - 'js/site-shell-fast.min.js'
      - 'js/team-logo-resolver.min.js'
      - 'dados laff/**'
      - 'team-data/logo-map.json'
      - 'functions/career-team-catalog.*'
      - 'scripts/build-career-team-catalog.py'
      - 'test/laff-loading.test.cjs'
      - 'functions/test/career-team-catalog.test.cjs'
      - '.github/workflows/test-laff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/laff-tests --no-save --no-audit --no-fund jsdom@26.1.0
      - run: python3 scripts/build-career-team-catalog.py --check
      - run: node --check js/laff.min.js && node --check js/site-shell-fast.min.js
      - run: node --test test/laff-loading.test.cjs functions/test/career-team-catalog.test.cjs
        env:
          NODE_PATH: /tmp/laff-tests/node_modules
