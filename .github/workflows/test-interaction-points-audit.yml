name: Test interaction points audit
on:
  pull_request:
    paths:
      - 'cloudflare/camp-notifications/interaction-ranking.js'
      - 'cloudflare/camp-notifications/worker.js'
      - 'cloudflare/camp-notifications/test/interaction-ranking.test.mjs'
      - 'cloudflare/camp-notifications/test/economy-api.test.mjs'
      - 'js/admin-economy.js'
      - 'js/admin-interaction-audit.mjs'
      - '.github/workflows/test-interaction-points-audit.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/camp-notifications/interaction-ranking.js'
      - 'cloudflare/camp-notifications/worker.js'
      - 'cloudflare/camp-notifications/test/interaction-ranking.test.mjs'
      - 'cloudflare/camp-notifications/test/economy-api.test.mjs'
      - 'js/admin-economy.js'
      - 'js/admin-interaction-audit.mjs'
      - '.github/workflows/test-interaction-points-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate browser modules and read-only API
        run: |
          node --check js/admin-economy.js
          node --check js/admin-interaction-audit.mjs
          node --check cloudflare/camp-notifications/interaction-ranking.js
          node --check cloudflare/camp-notifications/worker.js
      - name: Install notification Worker runtime dependency
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: cloudflare/camp-notifications
      - name: Test per-user report totals and private administrative access
        run: node --test --test-timeout=60000 cloudflare/camp-notifications/test/interaction-ranking.test.mjs cloudflare/camp-notifications/test/economy-api.test.mjs test/admin-economy-form.test.mjs
