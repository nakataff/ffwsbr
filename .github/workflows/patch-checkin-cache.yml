name: Patch checkin cache

on:
  push:
    paths:
      - '.github/workflows/patch-checkin-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh check-in asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in ['interacoes.html','js/site-analytics.js']:
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              t2 = re.sub(r'community-checkin\.js\?v=[^\"\']+', 'community-checkin.js?v=20260917-relink-v3', t)
              if t2 != t:
                  p.write_text(t2, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interacoes.html js/site-analytics.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Atualiza cache do vínculo por código no check-in"
          git push
