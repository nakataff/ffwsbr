name: Deploy Instagram Community (Cloudflare)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/instagram-community/**'
      - '.github/workflows/deploy-instagram-community-cloudflare.yml'
      - 'js/admin-stories.js'
      - 'css/admin-stories.css'
      - 'test/admin-stories-ui.test.cjs'
permissions:
  contents: read
concurrency:
  group: deploy-instagram-community-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test scores, history, cache and settlements
        run: npm test
        working-directory: cloudflare/instagram-community
      - name: Test story review interface
        run: |
          mkdir -p /tmp/cff-story-ui-test
          cp test/game-gifts-browser-package.json /tmp/cff-story-ui-test/package.json
          npm install --prefix /tmp/cff-story-ui-test --no-audit --no-fund
          NODE_PATH=/tmp/cff-story-ui-test/node_modules node --test --test-timeout=15000 test/admin-stories-ui.test.cjs
      - name: Check Cloudflare access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing from repository Actions secrets.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing from repository Actions secrets.'; exit 1; }
      - run: npm install --no-audit --no-fund
        working-directory: cloudflare/instagram-community
      - name: Deploy the existing community Worker
        run: npm run deploy
        working-directory: cloudflare/instagram-community
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confirm version, initialize D1 through the existing binding and warm the ranking
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 20 --output health.json https://cff-instagram-community.nakataffb4.workers.dev/health
            if node -e 'const h=JSON.parse(require("node:fs").readFileSync("health.json","utf8"));if(h.version!=="20261016-saved-months-v1"||h.storyReviewVersion!=="20261019-story-batch-v1"||h.profileInsightsVersion!=="20261012-community-profile-v1")throw Error("Waiting for community version to propagate");'; then
              break
            fi
            test "$attempt" -lt 6 || exit 1
            sleep 5
          done
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 --output ranking.json 'https://cff-instagram-community.nakataffb4.workers.dev/api/ranking?period=week'
          node -e 'const r=JSON.parse(require("node:fs").readFileSync("ranking.json","utf8"));if(!r.users||r.period?.type!=="week"||r.rules?.storyApprovalRequired!==true)throw Error("Public ranking check failed");console.log("Optimized community Worker is ready.");'
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 --output months.json 'https://cff-instagram-community.nakataffb4.workers.dev/api/ranking/months?limit=24'
          node -e 'const m=JSON.parse(require("node:fs").readFileSync("months.json","utf8"));if(!m.ok||m.frozen!==true||!Array.isArray(m.history)||m.history.some(r=>!r.frozen||!/^20\d{2}-\d{2}$/.test(r.month)))throw Error("Saved monthly history check failed");'
          curl --silent --show-error --output denied.json --write-out '%{http_code}' https://cff-instagram-community.nakataffb4.workers.dev/api/admin/stories > status.txt
          node -e 'if(require("node:fs").readFileSync("status.txt","utf8").trim()!=="401")throw Error("Story review endpoint must require admin authentication");'
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 --output peers.json 'https://cff-instagram-community.nakataffb4.workers.dev/api/community/peers?period=week&usernames=nakataff'
          node -e 'const p=JSON.parse(require("node:fs").readFileSync("peers.json","utf8"));if(!p.ok||p.period!=="week"||!Array.isArray(p.users))throw Error("Community peers check failed");'
