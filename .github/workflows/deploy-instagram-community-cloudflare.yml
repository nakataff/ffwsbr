name: Deploy Instagram Community (Cloudflare)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/instagram-community/**'
      - '.github/workflows/deploy-instagram-community-cloudflare.yml'
permissions:
  contents: read
concurrency:
  group: deploy-instagram-community-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test scores, history, cache and settlements
        run: npm test
        working-directory: cloudflare/instagram-community
      - name: Check Cloudflare access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing from repository Actions secrets.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing from repository Actions secrets.'; exit 1; }
      - run: npm install --no-audit --no-fund
        working-directory: cloudflare/instagram-community
      - name: Create cache tables and correction triggers
        run: npx wrangler d1 execute cff-instagram-community --remote --file=migrations/2026-10-12-shared-cache.sql
        working-directory: cloudflare/instagram-community
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the existing community Worker
        run: npm run deploy
        working-directory: cloudflare/instagram-community
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confirm optimization version and warm the public ranking cache
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 20 --output health.json https://cff-instagram-community.nakataffb4.workers.dev/health
          node -e 'const h=JSON.parse(require("node:fs").readFileSync("health.json","utf8"));if(h.version!=="20261012-d1-savings-v1")throw Error("Unexpected community version");'
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 --output ranking.json 'https://cff-instagram-community.nakataffb4.workers.dev/api/ranking?period=week'
          node -e 'const r=JSON.parse(require("node:fs").readFileSync("ranking.json","utf8"));if(!r.users||r.period?.type!=="week")throw Error("Public ranking check failed");console.log("Optimized community Worker is ready.");'
