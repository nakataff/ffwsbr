name: Diagnostico D1 de interacoes
on:
  push:
    branches:
      - codex/diagnostico-interacoes-20261116
permissions: {}
jobs:
  counts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consultar contagens no binding existente, sem publicar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CFF_REPO_IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          cf_diag_dir=$(mktemp -d)
          cd "$cf_diag_dir"
          cat > wrangler.jsonc <<'CONF'
          {"name":"cff-community-diag-20261116","main":"worker.js","compatibility_date":"2026-09-14","d1_databases":[{"binding":"DB","database_name":"cff-instagram-community","database_id":"48e14987-34f9-4591-874f-c45c513dcb39","remote":true}]}
          CONF
          cat > worker.js <<'NODE'
          export default {async fetch(req,{DB}){
            const start=Date.parse('2026-11-15T00:00:00-03:00'),week=Date.parse('2026-11-16T00:00:00-03:00');
            const queries=[
              DB.prepare("SELECT day_key,type,count(*) total,max(created_at) last_at FROM awards WHERE day_key BETWEEN '2026-11-15' AND '2026-11-22' GROUP BY day_key,type ORDER BY day_key,type"),
              DB.prepare("SELECT week_key,status,count(*) total,max(event_at) last_at FROM story_reviews WHERE status IN ('pending','approved','rejected') AND event_at>=? GROUP BY week_key,status").bind(start),
              DB.prepare("SELECT CASE WHEN received_at>=? THEN 'current' ELSE 'previous' END period,CASE WHEN kind IN ('comment_rejected_media_age','unrecognized_change','unrecognized_message','unrecognized_entry','checkin_debug') THEN kind ELSE 'other' END kind,count(*) total,max(received_at) last_at,SUM(CASE WHEN kind='comment_rejected_media_age' AND json_valid(payload) AND COALESCE(json_extract(payload,'$.mediaPublishedAt'),0)=0 THEN 1 ELSE 0 END) missing_media_time FROM raw_events WHERE id>(SELECT coalesce(max(id),0)-5000 FROM raw_events) AND received_at>=? GROUP BY 1,2").bind(week,start),
              DB.prepare("SELECT CASE WHEN received_at>=? THEN 'current' ELSE 'previous' END period, json_extract(payload,'$.identity[0].status') status, json_extract(payload,'$.identity[0].error.code') meta_code,json_extract(payload,'$.identity[0].error.subcode') meta_subcode,count(*) total FROM raw_events WHERE id>(SELECT coalesce(max(id),0)-5000 FROM raw_events) AND received_at>=? AND kind='checkin_debug' AND json_valid(payload) GROUP BY 1,2,3,4").bind(week,start),
              DB.prepare("SELECT CASE WHEN json_extract(payload,'$.field')='comments' THEN 'comments' WHEN json_extract(payload,'$.field')='mentions' THEN 'mentions' WHEN json_extract(payload,'$.field')='messages' THEN 'messages' WHEN kind='unrecognized_message' AND json_extract(payload,'$.hasReferral') THEN 'message_referral' WHEN kind='unrecognized_message' AND json_array_length(json_extract(payload,'$.attachmentTypes'))>0 THEN 'message_attachment' ELSE kind END category,count(*) total FROM raw_events WHERE id>(SELECT coalesce(max(id),0)-5000 FROM raw_events) AND received_at>=? AND kind IN ('unrecognized_change','unrecognized_message','unrecognized_entry') AND json_valid(payload) GROUP BY 1").bind(week)
            ];
            const results=await Promise.all(queries.map(query=>query.all()));
            return Response.json(Object.fromEntries(['awards','stories','raw','meta','shapes'].map((name,index)=>[name,results[index].results])));
          }};
          NODE
          npx --yes wrangler@4 dev --config wrangler.jsonc --ip 127.0.0.1 --port 8972 --show-interactive-dev-session=false > dev.log 2>&1 &
          cf_diag_pid=$!
          trap 'kill "$cf_diag_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          const token=process.env.CFF_REPO_IG_TOKEN;
          if(!token){console.log('Repo Meta token present: false');}
          else for(const base of ['https://graph.instagram.com','https://graph.facebook.com']){
            try {
              const response=await fetch(base+'/v23.0/me?fields=id%2Cusername',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(12000)});
              const payload=await response.json();
              console.log('Repo Meta token health',base,response.status,{code:payload.error?.code,subcode:payload.error?.error_subcode,isCentralAccount:/^centralfreefire_?$/i.test(payload.username||'')});
            } catch(error){console.log('Repo Meta token health',base,error.name);}
          }
          NODE
          for attempt in $(seq 1 22); do
            if curl --fail --silent --max-time 10 http://127.0.0.1:8972/ > aggregate.json; then
              node -e 'const r=JSON.parse(require("node:fs").readFileSync("aggregate.json","utf8"));for(const [key,value] of Object.entries(r))console.log("AGG",key,JSON.stringify(value));'
              exit 0
            fi
            if ! kill -0 "$cf_diag_pid" 2>/dev/null; then break; fi
            sleep 3
          done
          grep -Ei 'error|problem|denied|failed' dev.log | head -8 || true
          exit 1
