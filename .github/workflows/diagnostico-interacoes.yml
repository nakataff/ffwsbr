name: Verifica retorno dos comentarios
on:
  push:
    branches:
      - codex/diagnostico-interacoes-20261116
permissions: {}
jobs:
  counts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir eventos registrados, sem modificar dados
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cff_comment_check=$(mktemp -d)
          cd "$cff_comment_check"
          cat > wrangler.jsonc <<'CONF'
          {"name":"cff-community-diag-20261116","main":"worker.js","compatibility_date":"2026-09-14","d1_databases":[{"binding":"DB","database_name":"cff-instagram-community","database_id":"48e14987-34f9-4591-874f-c45c513dcb39","remote":true}]}
          CONF
          cat > worker.js <<'NODE'
          export default {async fetch(request,{DB}){
            const today=Date.parse('2026-11-16T00:00:00-03:00');
            const awards=await DB.prepare("SELECT COUNT(*) total, COALESCE(SUM(points),0) points, MIN(created_at) first_at, MAX(created_at) last_at FROM awards WHERE day_key='2026-11-16' AND type='comment'").first();
            const failures=await DB.prepare("SELECT COUNT(*) total, MAX(received_at) last_at, COALESCE(SUM(CASE WHEN received_at>=? AND json_valid(payload) AND COALESCE(json_extract(payload,'$.mediaPublishedAt'),0)=0 THEN 1 ELSE 0 END),0) missing_date_since_success FROM raw_events WHERE id>(SELECT coalesce(max(id),0)-5000 FROM raw_events) AND kind='comment_rejected_media_age' AND received_at>=?").bind(awards.first_at||Date.now(),today).first();
            return Response.json({awards,failures});
          }};
          NODE
          npx --yes wrangler@4 dev --config wrangler.jsonc --ip 127.0.0.1 --port 8972 --show-interactive-dev-session=false > dev.log 2>&1 &
          cff_poll_pid=$!
          trap 'kill "$cff_poll_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 18); do
            if curl --fail --silent --max-time 10 http://127.0.0.1:8972/ > result.json; then
              node -e 'const r=JSON.parse(require("node:fs").readFileSync("result.json","utf8")); console.log("CFF_RESULT",JSON.stringify(r));'
              exit 0
            fi
            if ! kill -0 "$cff_poll_pid" 2>/dev/null; then break; fi
            sleep 3
          done
          grep -Ei 'error|problem|denied|failed' dev.log | head -8 || true
          exit 1
