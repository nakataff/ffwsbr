name: Add live channel link mode

on:
  push:
    paths:
      - .github/workflows/add-live-channel-link-mode.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch files
        run: python .github/scripts/patch_live_channel.py

      - name: Commit changes
        run: |
          rm -f .github/workflows/add-live-channel-link-mode.yml .github/scripts/patch_live_channel.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html js/admin-core.js js/admin.js js/home-live-widget.min.js index.html .github/workflows/add-live-channel-link-mode.yml .github/scripts/patch_live_channel.py
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Adiciona link automático de canal nas transmissões"
          git push
