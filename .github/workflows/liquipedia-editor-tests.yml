name: Liquipedia editor output tests
on:
  push:
    paths:
      - 'admin-liquipedia/app.js'
      - 'admin-liquipedia/enhancements.js'
      - 'test/liquipedia-prize-options.test.cjs'
      - '.github/workflows/liquipedia-editor-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/liquipedia-prize-options.test.cjs
      - run: node --check admin-liquipedia/app.js && node --check admin-liquipedia/enhancements.js
